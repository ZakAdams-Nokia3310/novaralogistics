  $description: String
  $km: Int!
  $serviceIntervalKm: Int!
  $nextServiceKm: Int!
  $imageUrl: String
  $organisationId: UUID
) {
  vehicle_insert(data: {
    make: $make
    model: $model
    year: $year
    type: $type
    regPlate: $regPlate
    description: $description
    km: $km
    serviceIntervalKm: $serviceIntervalKm
    nextServiceKm: $nextServiceKm
    status: AVAILABLE
    imageUrl: $imageUrl
    organisationId: $organisationId
  })
