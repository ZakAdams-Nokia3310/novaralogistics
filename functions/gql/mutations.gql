# ── Notifications ── see controllers/dataController.js's createNotification()
# helper. CreateNotification is server-internal only (never in the registry,
# same precedent as CreateRentalEvent above). MarkNotificationRead's
# ownership check happens BEFORE this runs (dataController.js fetches the
# notification via GetNotificationById and verifies it belongs to the
# caller) — the mutation itself is PK-only, Data Connect's generated
# _update can't filter by user_id too.
mutation CreateNotification(
  $userId: UUID!
  $type: NotificationType!
  $title: String!
  $body: String!
  $linkPath: String
) {
  notification_insert(data: {
    userId: $userId
    type: $type
    title: $title
    body: $body
    linkPath: $linkPath
  })
}

mutation MarkNotificationRead($id: UUID!) {
  notification_update(id: $id, data: { read: true })
}

