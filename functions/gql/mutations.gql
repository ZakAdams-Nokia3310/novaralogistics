# ── Credit check ── see functions/services/creditCheck.js. CompleteMockCreditCheck's
# $score is always server-computed and injected by dataController.js's
# execute() (see its CompleteMockCreditCheck special case) — never trusted
# from the client, same principle as reviewedById above.
mutation RequestCreditCheck($id: UUID!) {
  rentalApplication_update(id: $id, data: {
    creditCheckStatus: REQUESTED
    creditCheckRequestedAt_expr: "request.time"
    updatedAt_expr: "request.time"
  })
}

mutation CompleteMockCreditCheck($id: UUID!, $score: Int!) {
  rentalApplication_update(id: $id, data: {
    creditCheckStatus: COMPLETED
    creditCheckScore: $score
    creditCheckCompletedAt_expr: "request.time"
    updatedAt_expr: "request.time"
  })
}

mutation DeclineCreditCheck($id: UUID!, $acknowledged: Boolean!) {
  rentalApplication_update(id: $id, data: {
    creditCheckStatus: DECLINED
    creditCheckDeclinedAcknowledged: $acknowledged
    updatedAt_expr: "request.time"
  })
}

