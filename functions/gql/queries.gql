query GetUserTotpByEmail($email: String!) {
  users(where: { email: { eq: $email } }, limit: 1) {
    id
    role
    totpEnabled
    totpSecretEnc
    totpBackupCodesEnc
    totpVerifiedAt
  }
}

query GetUserByEmail($email: String!) {
  users(where: { email: { eq: $email } }, limit: 1) {
    id
    name
    email
    role
    organisation { id name }
    status
    avatarUrl
    bio
    position
    department
    phone
    # KYC / rental-readiness fields — see schema.gql's User doc comment.
    # Fetched here so apply-rental.html can auto-fill its form and
    # profile.html can show/edit them, without a separate query.
    idNumber
    dateOfBirth
    address
    city
    province
    postalCode
    employmentStatus
    employerName
    monthlyIncome
    yearsEmployed
    bank
    accountType
    outstandingCredit
    termsAcceptedAt
    createdAt
    customRole { id name permissions }
  }
}

query ListAllRoles {
  roles(orderBy: { name: ASC }) {
    id
    name
    description
    permissions
    createdBy { id name }
    createdAt
    updatedAt
  }
}

query GetRoleById($id: UUID!) {
  role(id: $id) {
    id
    name
    permissions
  }
}

# Feeds admin-reports.html's Activity tab — the DB-backed audit trail
# written by services/auditLog.js's logEvent() on every mutation/denied
# access, distinct from admin-audit.html's separate client-only
# (localStorage) log.
query ListAuditLogs($limit: Int) {
  auditLogs(orderBy: { createdAt: DESC }, limit: $limit) {
    id
    user { id name }
    userName
    userRole
    action
    details
    page
    createdAt
  }
}

# ── Notifications ── ListNotifications is client-reachable (ownField-scoped
# to the caller's own dbId — see registry/dataOperations.js). GetNotificationById
# is server-internal only, used by dataController.js's MarkNotificationRead
# special case to verify a notification belongs to the caller before marking
# it read (Data Connect's generated _update can't filter by user_id itself).
query ListNotifications($userId: UUID!) {
  notifications(where: { userId: { eq: $userId } }, orderBy: { createdAt: DESC }, limit: 50) {
    id
    type
    title
    body
    linkPath
    read
    createdAt
  }
}

query GetNotificationById($id: UUID!) {
  notification(id: $id) {
    id
    user { id }
  }
}
