# Server-internal only (not in the registry, never reachable via /api/data/execute)
# — used to read a rental's current status before a status-changing mutation,
# so dataController.js can log an accurate from/to RentalEvent.
query GetRentalById($id: UUID!) {
  rental(id: $id) {
    id
    status
    organisation {
      id
    }
    # For notifying the renter on a status change — null for a walk-in
    # rental with no linked application (see logRentalStatusChangeIfNeeded).
    application {
      applicantUser {
        id
      }
    }
  }
}

query ListAllRentals {
  rentals(orderBy: { updatedAt: DESC }) {
    id
    vehicle {
      id
      make
      model
      regPlate
    }
    equipmentName
    clientName
    organisation {
      id
      name
    }
    startDate
    returnDate
    valueZar
    status
    notes
    # For the rental timeline (see RentalEvent) — "submitted"/"reviewed" entries
    # are synthesized from these fields rather than duplicated as events.
    application {
      id
      ref
      status
      submittedAt
      reviewedAt
      reviewedBy {
        name
      }
      rejectionReason
    }
    createdAt
    updatedAt
  }
}

query ListRentalsByOrg($organisationId: UUID!) {
  rentals(
    where: { organisationId: { eq: $organisationId } }
    orderBy: { startDate: DESC }
  ) {
    id
    vehicle {
      id
      make
      model
      regPlate
    }
    equipmentName
    clientName
    organisation {
      id
      name
    }
    startDate
    returnDate
    valueZar
    status
    notes
    application {
      id
      ref
      status
      submittedAt
      reviewedAt
      reviewedBy {
        name
      }
      rejectionReason
    }
    createdAt
    updatedAt
  }
}

# Timeline entries for a single rental — see dataconnect/schema/schema.gql's
# RentalEvent doc comment for why "submitted"/"reviewed" aren't stored here.
# $organisationId is always overridden server-side with the caller's own org
# (see registry/dataOperations.js's orgField) — filtering on the RELATED
# rental's organisationId, not a bare column on rental_events itself, so a
# rentalId belonging to a different org returns an empty timeline rather
# than another org's data.
query ListRentalEvents($rentalId: UUID!, $organisationId: UUID!) {
  rentalEvents(
    where: { rentalId: { eq: $rentalId }, rental: { organisationId: { eq: $organisationId } } }
    orderBy: { createdAt: ASC }
  ) {
    id
    type
    description
    fromStatus
    toStatus
    actorUser {
      name
    }
    createdAt
  }
}

