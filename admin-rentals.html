<!DOCTYPE html>
<html class="dark" lang="en"><head><script src="canonical-redirect.js"></script>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<title>Rental Tracking — EquipCore Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="theme.css" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;}
  body{font-family:'Inter',sans-serif;color:#e2e2e8;min-height:100vh;}
  .ms{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  .glass{background:rgba(255,255,255,.05);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.09);}
  .glass-lo{background:rgba(255,255,255,.03);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.07);}
  .grad{background:linear-gradient(135deg,#00f0ff,#7df4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  #sidebar-root{width:220px;height:100vh;position:fixed;left:0;top:0;z-index:50;display:flex;flex-direction:column;background:rgba(5,7,11,.94);border-right:1px solid rgba(255,255,255,.06);}
  .main{margin-left:220px;min-height:100vh;}
  .topbar{height:56px;position:sticky;top:0;z-index:40;background:rgba(8,10,14,.82);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;padding:0 26px;}
  .body{padding:22px 26px;}
  .tbl{width:100%;border-collapse:collapse;}
  .tbl th{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#849495;padding:10px 14px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02);}
  .tbl td{padding:12px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl tbody tr:hover td{background:rgba(0,240,255,.02);}
  .b{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:10px;}
  .b::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}
  .ba{background:rgba(0,212,170,.1);color:#00d4aa;}
  .bp{background:rgba(255,217,61,.1);color:#ffd93d;}
  .bo{background:rgba(255,107,107,.1);color:#ff6b6b;}
  .bc{background:rgba(209,188,255,.1);color:#d1bcff;}
  .btnp{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;background:#00f0ff;color:#003a3c;font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:13px;border-radius:9px;border:none;cursor:pointer;text-decoration:none;transition:filter .18s;}
  .btnp:hover{filter:brightness(1.08);}
  .btng{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;background:rgba(255,255,255,.05);color:#e2e2e8;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;border-radius:9px;border:1px solid rgba(255,255,255,.08);cursor:pointer;text-decoration:none;transition:background .18s;}
  .btng:hover{background:rgba(255,255,255,.09);}
  input,select,textarea{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:9px;color:#e2e2e8;font-family:'Inter',sans-serif;font-size:13px;padding:8px 11px;width:100%;outline:none;transition:border-color .18s;}
  input:focus,select:focus,textarea:focus{border-color:#00f0ff;}
  select option{background:#111317;}
  textarea{resize:vertical;}
  label{font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:5px;}
  .btnr{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;background:rgba(255,107,107,.08);color:#ff6b6b;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;border-radius:9px;border:1px solid rgba(255,107,107,.18);cursor:pointer;transition:background .18s;}
  .btnr:hover{background:rgba(255,107,107,.14);}
  .tab-btn{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:8px 16px;border-radius:9px;border:1px solid rgba(255,255,255,.07);background:none;color:#849495;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:7px;}
  .tab-btn.active{background:rgba(0,240,255,.09);color:#00f0ff;border-color:rgba(0,240,255,.2);}
  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:700;}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(8,10,14,.85);backdrop-filter:blur(12px);z-index:900;align-items:center;justify-content:center;}
  .modal-bg.show{display:flex;}
  @keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .modal-bg.show .modal-card{animation:slideUp .22s ease both;}
  .appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
  .appcard{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:11px;min-width:0;transition:border-color .18s;}
  .appcard:hover{border-color:rgba(0,240,255,.18);}
  .appcard-top{display:flex;align-items:flex-start;gap:10px;}
  .appcard-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,rgba(0,240,255,.18),rgba(125,244,255,.06));color:#00f0ff;display:flex;align-items:center;justify-content:center;font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:13px;flex-shrink:0;}
  .appcard-name{font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .appcard-ref{font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;margin-top:1px;}
  .appcard-meta{display:flex;flex-direction:column;gap:4px;}
  .appcard-link{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#b9cacb;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .appcard-link:hover{color:#00f0ff;}
  .appcard-link .ms{font-size:14px;color:#849495;flex-shrink:0;}
  .appcard-row{display:flex;align-items:center;gap:6px;font-size:12px;color:#b9cacb;}
  .appcard-row .ms{font-size:15px;color:#849495;flex-shrink:0;}
  .appcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:9px;border-top:1px solid rgba(255,255,255,.05);}
  .appcard-submitted{font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;}
  .appcard-actions{display:flex;gap:8px;}
  .cb{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
  .cb-none{background:rgba(255,255,255,.05);color:#849495;}
  .cb-req{background:rgba(255,217,61,.1);color:#ffd93d;}
  .cb-done{background:rgba(0,212,170,.1);color:#00d4aa;}
  .cb-decl{background:rgba(255,107,107,.1);color:#ff6b6b;}
  @keyframes ccspin{to{transform:rotate(360deg)}}
  .ccspin{display:inline-block;animation:ccspin 1s linear infinite;}
  .creditbar{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;}
  .creditbar-fill{height:100%;border-radius:99px;}
  .ccacct{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);}
  .ccacct:last-child{border-bottom:none;}
  .ccstat{display:flex;flex-direction:column;gap:2px;}
  .ccstat-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:#849495;text-transform:uppercase;letter-spacing:.06em;}
  .ccstat-val{font-family:'JetBrains Mono',monospace;font-size:12px;color:#e2e2e8;}
  .ccpay{display:flex;gap:2px;overflow-x:auto;padding-bottom:2px;}
  .ccpay span{width:8px;height:14px;border-radius:2px;flex-shrink:0;}
  @media(max-width:600px){.ccstats{grid-template-columns:repeat(2,1fr)!important}}
  @media(max-width:768px){#sidebar-root{display:none!important}.main{margin-left:0!important}}
  @media(max-width:600px){
    .body{padding:14px 12px!important}
    .topbar{padding:0 14px!important;height:auto!important;min-height:56px;flex-wrap:wrap;padding-top:10px!important;padding-bottom:10px!important;gap:6px}
    #kpiRow{grid-template-columns:repeat(2,1fr)!important}
    .tbl th,.tbl td{padding:8px 10px!important;font-size:12px!important}
    .modal-bg{align-items:flex-end!important}
    .modal-bg .modal-card{border-radius:16px 16px 0 0!important;width:100%!important;max-width:100%!important;margin:0!important;max-height:88vh!important;overflow-y:auto!important}
    .btnp,.btng,.btnr{min-height:42px}
  }
</style>
</head>
<body>
<aside id="sidebar-root"></aside>

<div class="main">
  <div class="topbar">
    <div>
      <div style="font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:15px">Rental Tracking</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495">All active, pending and overdue rentals — due-back countdowns live</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <a href="admin-fleet" class="btng" style="font-size:12px;padding:7px 12px">
        <span class="material-symbols-outlined ms" style="font-size:15px">garage</span>Fleet
      </a>
      <button class="btnp" id="addRentalBtn" onclick="openAddRental()" style="font-size:12px;padding:7px 13px">
        <span class="material-symbols-outlined ms" style="font-size:15px">add</span>Add Rental
      </button>
    </div>
  </div>

  <div class="body">
    <!-- Tabs -->
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">
      <button class="tab-btn active" id="tabRentalsBtn" onclick="switchRentalTab('rentals')">
        <span class="material-symbols-outlined ms" style="font-size:15px">local_shipping</span>Rentals
      </button>
      <button class="tab-btn" id="tabApplicationsBtn" onclick="switchRentalTab('applications')">
        <span class="material-symbols-outlined ms" style="font-size:15px">mark_email_unread</span>Applications
        <span class="badge" id="pendingAppBadge" style="background:rgba(255,217,61,.18);color:#ffd93d;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:700">0</span>
      </button>
    </div>

    <!-- ── Rentals panel ─────────────────────────────────────────────────── -->
    <div id="panelRentals">
      <!-- KPIs (rendered by JS) -->
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:18px" id="kpiRow"></div>

      <!-- Filter bar -->
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
        <div style="position:relative;flex:1;min-width:200px">
          <span class="material-symbols-outlined ms" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:16px;color:#849495;pointer-events:none">search</span>
          <input id="rSearch" placeholder="Search rental ID, equipment, or client…" style="padding-left:36px;width:100%;" oninput="renderTable()"/>
        </div>
        <select id="rStatus" onchange="renderTable()" style="width:160px">
          <option value="all">All Statuses</option>
          <option value="active">Active</option>
          <option value="pending">Pending</option>
          <option value="overdue">Overdue</option>
          <option value="complete">Complete</option>
        </select>
        <select id="rDue" onchange="renderTable()" style="width:180px">
          <option value="all">All Return Dates</option>
          <option value="overdue">Overdue Now</option>
          <option value="today">Due Today</option>
          <option value="soon">Due Within 3 Days</option>
          <option value="week">Due This Week</option>
        </select>
      </div>

      <!-- Table -->
      <div class="glass" style="border-radius:13px;overflow:hidden">
        <div style="overflow-x:auto">
          <table class="tbl" id="rTable">
            <thead><tr>
              <th>Equipment</th>
              <th>Client</th>
              <th>Due Back</th>
              <th>Value</th>
              <th>Status</th>
              <th>Actions</th>
            </tr></thead>
            <tbody id="rBody"></tbody>
          </table>
        </div>
        <div style="padding:13px 16px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between">
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#849495">Showing <span id="showing">0</span> rentals</span>
          <span id="overdueAlert" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#ff6b6b;display:none"></span>
        </div>
      </div>
    </div>

    <!-- ── Applications panel ────────────────────────────────────────────── -->
    <div id="panelApplications" style="display:none">
      <div class="appgrid" id="appGrid"></div>
    </div>
  </div>
</div>

<!-- Review Application Modal -->
<div class="modal-bg" id="reviewAppModal">
  <div class="modal-card glass" style="border-radius:16px;padding:28px;width:100%;max-width:580px;border-color:rgba(0,240,255,.14);max-height:90vh;overflow-y:auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
      <div style="width:36px;height:36px;border-radius:9px;background:rgba(0,240,255,.1);display:flex;align-items:center;justify-content:center">
        <span class="material-symbols-outlined ms" style="font-size:18px;color:#00f0ff">description</span>
      </div>
      <div>
        <div style="font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:15px">Full Application</div>
        <div style="font-size:12px;color:#849495" id="reviewAppSub">—</div>
      </div>
      <button onclick="closeReviewApp()" style="margin-left:auto;background:none;border:none;color:#849495;cursor:pointer;font-size:22px;line-height:1">×</button>
    </div>
    <div id="reviewAppContent" style="font-size:13px;color:#b9cacb;line-height:1.9;margin-bottom:14px"></div>

    <!-- Credit-check status, gates Approve below -->
    <div id="reviewCreditWrap" class="glass-lo" style="border-radius:10px;padding:13px 14px;margin-bottom:14px"></div>

    <div id="rejectReasonWrap" style="display:none;margin-bottom:14px">
      <label>Decline Reason <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#849495">(optional, shown to applicant)</span></label>
      <textarea id="rejectReasonInput" rows="2" placeholder="e.g. Credit check did not meet requirements"></textarea>
    </div>
    <div id="reviewAppErr" style="display:none;margin-bottom:14px;padding:9px 12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.2);border-radius:8px;font-size:12px;color:#ff6b6b;font-family:'JetBrains Mono',monospace"></div>
    <div style="display:flex;gap:10px" id="reviewAppActions">
      <button class="btnp" id="reviewApproveBtn" style="flex:1;justify-content:center;padding:11px" onclick="submitReview('APPROVED')">
        <span class="material-symbols-outlined ms" style="font-size:16px">check</span>Approve
      </button>
      <button class="btnr" style="flex:1;justify-content:center;padding:11px" onclick="beginReject()">
        <span class="material-symbols-outlined ms" style="font-size:16px">close</span>Decline
      </button>
    </div>
  </div>
</div>

<!-- Credit Report Modal (mock provider — see functions/services/creditCheck.js) -->
<div class="modal-bg" id="creditReportModal">
  <div class="modal-card glass" style="border-radius:16px;padding:28px;width:100%;max-width:680px;border-color:rgba(0,240,255,.14);max-height:90vh;overflow-y:auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
      <div style="width:36px;height:36px;border-radius:9px;background:rgba(0,240,255,.1);display:flex;align-items:center;justify-content:center">
        <span class="material-symbols-outlined ms" style="font-size:18px;color:#00f0ff">fact_check</span>
      </div>
      <div>
        <div style="font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:15px">Credit Report</div>
        <div style="font-size:12px;color:#849495" id="creditReportSub">—</div>
      </div>
      <button onclick="closeCreditReport()" style="margin-left:auto;background:none;border:none;color:#849495;cursor:pointer;font-size:22px;line-height:1">×</button>
    </div>
    <div id="creditReportContent"></div>
  </div>
</div>

<!-- Add Rental Modal -->
<div class="modal-bg" id="addRentalModal">
  <div class="modal-card glass" style="border-radius:16px;padding:28px;width:100%;max-width:520px;border-color:rgba(0,240,255,.14);max-height:90vh;overflow-y:auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px">
      <div style="width:36px;height:36px;border-radius:9px;background:rgba(0,240,255,.1);display:flex;align-items:center;justify-content:center">
        <span class="material-symbols-outlined ms" style="font-size:18px;color:#00f0ff">add_circle</span>
      </div>
      <div>
        <div style="font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:15px">Create Rental</div>
        <div style="font-size:12px;color:#849495">Add a new rental to the tracking system</div>
      </div>
      <button onclick="closeAddRental()" style="margin-left:auto;background:none;border:none;color:#849495;cursor:pointer;font-size:22px;line-height:1">×</button>
    </div>
    <form id="addRentalForm" style="display:flex;flex-direction:column;gap:14px">
      <div>
        <label>Vehicle <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#849495">(optional)</span></label>
        <select id="arVehicle" onchange="onArVehicleChange()">
          <option value="">No specific vehicle</option>
        </select>
      </div>
      <div><label>Equipment / Item Name</label><input id="arEquipment" placeholder="e.g. Cat 390F Excavator" required/></div>
      <div><label>Client Name</label><input id="arClient" placeholder="e.g. Ngozi Mining Co." required/></div>
      <div>
        <label>Organisation <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#849495">(optional)</span></label>
        <select id="arOrg">
          <option value="">No organisation</option>
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label>Start Date</label><input id="arStart" type="date" required/></div>
        <div><label>Return Date</label><input id="arEnd" type="date" required/></div>
      </div>
      <div><label>Rental Value (ZAR)</label><input id="arValue" type="number" placeholder="0" min="0" step="100" required/></div>
      <div>
        <label>Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#849495">(optional)</span></label>
        <textarea id="arNotes" rows="3" placeholder="Any additional notes about this rental…"></textarea>
      </div>
      <div id="arErr" style="display:none;padding:9px 12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.2);border-radius:8px;font-size:12px;color:#ff6b6b;font-family:'JetBrains Mono',monospace"></div>
      <button class="btnp" type="submit" style="width:100%;justify-content:center;padding:11px">
        <span class="material-symbols-outlined ms" style="font-size:16px">add</span>Create Rental
      </button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="security.js"></script>
<script src="auth.js"></script>
<script src="frontend/token-client.js"></script>
<script src="dc.js?v=2"></script>
<script src="sidebar.js?v=2"></script>
<script src="bg.js"></script>
<script src="transitions.js"></script>
<script>
buildSidebar('admin-rentals');
const _ecUser = EC_AUTH.require(['admin']);
// Rental applicant/equipment data can originate from the public,
// unauthenticated rental-application form — escape before innerHTML.
const esc = EC_SECURITY.sanitizeHtml, escA = EC_SECURITY.escJsAttr;
const _canEdit = EC_SECURITY.canEdit('admin-rentals');
if (!_canEdit) document.getElementById('addRentalBtn').style.display = 'none';
DC_DATA.setOrgScope(_ecUser.orgId);

function today() {
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}

function daysLeft(dateStr) {
  const d = new Date(dateStr);
  d.setHours(0,0,0,0);
  return Math.ceil((d - today()) / (1000*60*60*24));
}

function fmtDate(dateStr) {
  return new Date(dateStr).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}

function returnCell(rental) {
  if (rental.status === 'complete') return `<span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#849495">Returned</span>`;
  const days = daysLeft(rental.returnDate);
  if (days < 0)  return `<div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#ff6b6b;font-weight:700">${Math.abs(days)}d overdue</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495">${fmtDate(rental.returnDate)}</div>`;
  if (days === 0) return `<div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#ff6b6b;font-weight:700">Due today</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495">${fmtDate(rental.returnDate)}</div>`;
  if (days <= 3)  return `<div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#ffd93d;font-weight:600">In ${days}d</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495">${fmtDate(rental.returnDate)}</div>`;
  return `<div style="font-family:'JetBrains Mono',monospace;font-size:11px">${fmtDate(rental.returnDate)}</div><div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495">in ${days}d</div>`;
}

function statusBadge(s) {
  if (s === 'active')   return `<span class="b ba">Active</span>`;
  if (s === 'pending')  return `<span class="b bp">Pending</span>`;
  if (s === 'overdue')  return `<span class="b bo">Overdue</span>`;
  if (s === 'complete') return `<span class="b bc">Complete</span>`;
  return `<span class="b">${s}</span>`;
}

function actionCell(rental) {
  const id = rental.id;
  // rental-detail.html is an edit/delete surface, not a pure read view (see
  // FEATURE_PAGE_ALIASES in security.js) — a view-only custom-role holder
  // can't open it, so don't offer a link that would just bounce them.
  if (!_canEdit) return '<span style="color:#849495;font-size:11px">View only</span>';
  const view = `<button class="btng" style="font-size:11px;padding:4px 8px" onclick="location.href='rental-detail?id=${id}'">View</button>`;
  if (rental.status === 'pending') return `
    <div style="display:flex;gap:5px">
      <button class="btnp" style="font-size:11px;padding:4px 8px" onclick="approveRental('${id}')">Approve</button>
      ${view}
    </div>`;
  if (rental.status === 'overdue' || (rental.status === 'active' && daysLeft(rental.returnDate) < 0)) return `
    <div style="display:flex;gap:5px">
      ${view}
      <button class="btng" style="font-size:11px;padding:4px 8px;color:#ff6b6b;border-color:rgba(255,107,107,.2)" onclick="chaseRental('${escA(id)}','${escA(rental.client)}')">Chase</button>
    </div>`;
  if (rental.status === 'complete') return `
    <div style="display:flex;gap:5px">
      ${view}
      <button class="btng" style="font-size:11px;padding:4px 8px">Invoice</button>
    </div>`;
  return `
    <div style="display:flex;gap:5px">
      ${view}
      <button class="btng" style="font-size:11px;padding:4px 8px" onclick="markReturned('${id}')">Returned</button>
    </div>`;
}

async function markReturned(id) {

function renderTable() {
  const q   = (document.getElementById('rSearch').value || '').toLowerCase();
  const sf  = document.getElementById('rStatus').value;
  const df  = document.getElementById('rDue').value;

  const rentals = DC_DATA.getRentals().filter(r => {
    if (sf !== 'all' && r.status !== sf) return false;
    if (df !== 'all') {
      const days = daysLeft(r.returnDate);
      if (df === 'overdue' && days >= 0) return false;
      if (df === 'today'   && days !== 0) return false;
      if (df === 'soon'    && (days < 0 || days > 3)) return false;
      if (df === 'week'    && (days < 0 || days > 7)) return false;
    }
    if (q && !`${r.id} ${r.equipment} ${r.client}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => {
    // Sort: overdue first, then by return date ascending
    const da = daysLeft(a.returnDate), db = daysLeft(b.returnDate);
    return da - db;
  });

  const overdueCount = rentals.filter(r => daysLeft(r.returnDate) < 0 && r.status !== 'complete').length;
  const alert = document.getElementById('overdueAlert');
  if (overdueCount > 0) {
    alert.style.display = '';
    alert.textContent   = `⚠ ${overdueCount} overdue rental${overdueCount > 1 ? 's' : ''} require attention`;
  } else {
    alert.style.display = 'none';
  }

  document.getElementById('showing').textContent = rentals.length;
  const tbody = document.getElementById('rBody');
  if (!rentals.length) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#849495;font-family:'JetBrains Mono',monospace;font-size:12px">No rentals match your filters</td></tr>`;
    return;
  }

  const isOverdueRow = r => (r.status === 'overdue' || (r.status === 'active' && daysLeft(r.returnDate) < 0));

  tbody.innerHTML = rentals.map(r => {
    const rowBg = isOverdueRow(r) ? 'background:rgba(255,107,107,.025)' : '';
    return `<tr style="${rowBg}cursor:pointer" onclick="location.href='rental-detail?id=${escA(r.id)}'">
      <td data-label="Equipment" style="font-weight:600">${esc(r.equipment)}</td>
      <td data-label="Client" style="font-size:12px;color:#b9cacb">${esc(r.client)}</td>
      <td data-label="Due Back">${returnCell(r)}</td>
      <td data-label="Value" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#00f0ff;font-weight:600">R${(r.value||0).toLocaleString()}</td>
      <td data-label="Status">${statusBadge(r.status)}</td>
      <td onclick="event.stopPropagation()">${actionCell(r)}</td>
    </tr>`;
  }).join('');
}

function openAddRental() {
  document.getElementById('addRentalForm').reset();
  document.getElementById('arErr').style.display = 'none';

  const vSel = document.getElementById('arVehicle');
  vSel.innerHTML = '<option value="">No specific vehicle</option>';
  DC_DATA.getVehicles().filter(v => v.status === 'available').forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.id;
    opt.dataset.name = `${v.make} ${v.model}`;
    opt.textContent = `${v.make} ${v.model} (${v.regPlate})`;
    vSel.appendChild(opt);
  });

  const oSel = document.getElementById('arOrg');
  oSel.innerHTML = '<option value="">No organisation</option>';
  DC_DATA.getOrgs().filter(o => o.status === 'active').forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.id;
    opt.textContent = o.name;
    oSel.appendChild(opt);
  });

  const todayStr = new Date().toISOString().slice(0, 10);
  const nextWeek = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);

  document.getElementById('arEnd').value   = nextWeek;

  document.getElementById('addRentalModal').classList.add('show');

function onArVehicleChange() {
  const sel = document.getElementById('arVehicle');
  const opt = sel.options[sel.selectedIndex];
  if (opt.value && opt.dataset.name) {
    document.getElementById('arEquipment').value = opt.dataset.name;
  }
}

document.getElementById('addRentalForm').addEventListener('submit', async e => {
  e.preventDefault();
  const vehicleId  = document.getElementById('arVehicle').value || null;
  const equipment  = document.getElementById('arEquipment').value.trim();
  const client     = document.getElementById('arClient').value.trim();
  const org        = document.getElementById('arOrg').value || null;
  const startDate  = document.getElementById('arStart').value;
  const returnDate = document.getElementById('arEnd').value;
  const value      = +document.getElementById('arValue').value;

function switchRentalTab(tab) {

  document.getElementById('panelApplications').style.display = tab === 'applications' ? '' : 'none';
  document.getElementById('tabRentalsBtn').classList.toggle('active', tab === 'rentals');
  document.getElementById('tabApplicationsBtn').classList.toggle('active', tab === 'applications');

function appStatusBadge(s) {
  if (s === 'pending')   return `<span class="b bp">Pending</span>`;
  if (s === 'approved')  return `<span class="b ba">Approved</span>`;
  if (s === 'rejected')  return `<span class="b bo">Declined</span>`;
  if (s === 'cancelled') return `<span class="b">Cancelled</span>`;
  return `<span class="b">${esc(s)}</span>`;
}

function timeAgo(dateVal) {
  if (!dateVal) return '—';
  const mins = Math.floor((Date.now() - new Date(dateVal).getTime()) / 60000);
  if (mins < 1)  return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)  return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return `${days}d ago`;
  return fmtDate(dateVal);
}

function initials(name) {
  return ((name || '').trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('') || '?').toUpperCase();
}

// Full reports aren't persisted server-side (see functions/services/
// creditCheck.js's doc comment) — cache the last-fetched one per
// application client-side so "View Credit Check" doesn't need a round trip
// right after Send-for-Credit-Check just resolved. Lost on page reload;
// viewCreditCheck() below re-fetches on a cache miss (safe — the mock
// report is deterministic per applicant, not randomised per call).
const _creditReports = {};

function riskBandColor(label) {
  if (label === 'Minimal Risk') return '#00d4aa';

// Refreshes both the card grid and (if open for this same application) the
// review modal's credit-check section — used after every credit-check
// mutation so neither surface goes stale.
function refreshAfterCreditCheckChange(id) {
  renderApplications();
  if (_reviewingAppId === id && document.getElementById('reviewAppModal').classList.contains('show')) {
    openReviewApp(id);
  }
}

async function sendForCreditCheck(id) {
  const app = DC_DATA.getRentalApplications().find(a => a.id === id);
  if (!app) return;
  const fee = Math.round(app.creditCheckFeeZar || 250);
  if (!confirm(`Send this application for a credit check?\n\nA R${fee} fee applies per check.`)) return;
  try {
    await DC_DATA.requestCreditCheck(id);
    refreshAfterCreditCheckChange(id);
    // Mock provider — simulates a real bureau's turnaround before resolving.
    setTimeout(async () => {
      try {
        const report = await DC_DATA.completeMockCreditCheck(id);
        if (report) _creditReports[id] = report;
        refreshAfterCreditCheckChange(id);
        window.showToast?.('success', 'Credit check complete.');
      } catch (err) {
        window.showToast?.('error', EC_SECURITY.safeErrMsg(err, 'Credit check failed.'));
      }
    }, 1600);
  } catch (err) {
    window.showToast?.('error', EC_SECURITY.safeErrMsg(err, 'Could not start credit check.'));
  }
}

async function declineCreditCheckFlow(id) {
  const ok = confirm('Decline the credit check for this application?\n\nWe will NOT be liable for any loss, default, or damage resulting from proceeding without a credit check. This cannot be undone.');
  if (!ok) return;
  try {
    await DC_DATA.declineCreditCheck(id);
    refreshAfterCreditCheckChange(id);
    window.showToast?.('success', 'Credit check declined.');
  } catch (err) {
    window.showToast?.('error', EC_SECURITY.safeErrMsg(err, 'Could not decline the credit check.'));
  }
}

function buildCreditReportHtml(a, report) {
  const bandColor = riskBandColor(report.riskBand);
  const openAccts = report.accounts.filter(x => x.status === 'OPEN').length;
  const closedAccts = report.accounts.filter(x => x.status === 'CLOSED').length;
  const adverseAccts = report.accounts.filter(x => x.status === 'ADVERSE').length;
  const totalOutstanding = report.accounts.reduce((s, x) => s + (x.balanceZar || 0), 0);
  const totalFacilities = report.accounts.reduce((s, x) => s + (x.limitZar || x.originalAmountZar || 0), 0);
  const totalInstalments = report.accounts.reduce((s, x) => s + (x.installmentZar || 0), 0);

  return `
    <div style="text-align:center;padding:6px 0 18px">
      <div style="font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:40px;color:${bandColor}">${report.score}<span style="font-size:16px;color:#849495;font-weight:600">/999</span></div>
      <div class="cb" style="background:${bandColor}1a;color:${bandColor};margin-top:6px">${esc(report.riskBand)}</div>
      <div class="creditbar" style="margin-top:12px;max-width:320px;margin-left:auto;margin-right:auto">
        <div class="creditbar-fill" style="width:${Math.round((report.score / 999) * 100)}%;background:${bandColor}"></div>
      </div>
      <div style="font-size:11px;color:#849495;margin-top:8px;max-width:420px;margin-left:auto;margin-right:auto">${esc(report.scoreExplanation)}</div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px">
      <div class="glass-lo" style="border-radius:10px;padding:10px 12px"><div class="ccstat-lbl">Accounts</div><div style="font-size:15px;font-weight:700">${report.accounts.length} <span style="font-size:11px;font-weight:400;color:#849495">(${openAccts} open · ${closedAccts} closed · ${adverseAccts} adverse)</span></div></div>
      <div class="glass-lo" style="border-radius:10px;padding:10px 12px"><div class="ccstat-lbl">Total Outstanding</div><div style="font-size:15px;font-weight:700">${moneyZar(totalOutstanding)} <span style="font-size:11px;font-weight:400;color:#849495">of ${moneyZar(totalFacilities)}</span></div></div>
      <div class="glass-lo" style="border-radius:10px;padding:10px 12px"><div class="ccstat-lbl">Monthly Instalments</div><div style="font-size:15px;font-weight:700">${moneyZar(totalInstalments)}</div></div>
      <div class="glass-lo" style="border-radius:10px;padding:10px 12px"><div class="ccstat-lbl">Adverse Records</div><div style="font-size:15px;font-weight:700">${report.adverse.handovers.length + report.adverse.judgments} <span style="font-size:11px;font-weight:400;color:#849495">(${report.adverse.handovers.length} handovers · ${report.adverse.judgments} judgments)</span></div></div>
    </div>

    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Accounts</div>
    <div class="glass-lo" style="border-radius:10px;padding:4px 14px;margin-bottom:16px">
      ${report.accounts.map(accountRowHtml).join('')}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Previous Enquiries</div>
        <div class="glass-lo" style="border-radius:10px;padding:10px 12px;font-size:12px">
          ${report.previousEnquiries.map(e => `<div style="padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;gap:8px"><span style="color:#849495;font-family:'JetBrains Mono',monospace;font-size:10px">${fmtDate(e.date)}</span><span style="text-align:right">${esc(e.enquirer)}<br><span style="color:#849495">${esc(e.reason)}</span></span></div>`).join('') || '<span style="color:#849495">None on record.</span>'}
        </div>
      </div>
      <div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Directorships &amp; Adverse</div>
        <div class="glass-lo" style="border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.9">
          <div>Company directorships: <b>${report.consumerDirectorSummary.numberOfCompanyDirectorships}</b></div>
          ${report.adverse.handovers.length
            ? report.adverse.handovers.map(h => `<div style="color:#ff6b6b">Handover: ${esc(h.provider)} — ${moneyZar(h.amountZar)} (${fmtDate(h.date)})</div>`).join('')
            : '<div style="color:#00d4aa">No handovers on record.</div>'}
          <div style="color:#849495">Judgments: ${report.adverse.judgments} · Debt review: ${report.adverse.debtReview ? 'Yes' : 'No'}</div>
        </div>
      </div>
    </div>

    <div style="padding:9px 11px;background:rgba(255,255,255,.03);border-radius:8px;font-size:11px;color:#849495;font-family:'JetBrains Mono',monospace">Test data — dummy report. No live credit bureau connected yet (CREDIT_CHECK_MODE=mock).</div>`;
}

async function viewCreditCheck(id) {
  const a = DC_DATA.getRentalApplications().find(x => x.id === id);
  if (!a || a.creditCheckStatus !== 'completed') return;
  document.getElementById('creditReportSub').textContent = a.applicantName;
  document.getElementById('creditReportContent').innerHTML = '<div style="text-align:center;padding:24px;color:#849495">Loading report…</div>';
  document.getElementById('creditReportModal').classList.add('show');

  let report = _creditReports[id];
  if (!report) {
    try {
      report = await DC_DATA.completeMockCreditCheck(id);
      if (report) _creditReports[id] = report;
    } catch (err) {
      document.getElementById('creditReportContent').innerHTML = `<div style="color:#ff6b6b;text-align:center;padding:24px">${esc(EC_SECURITY.safeErrMsg(err, 'Could not load the credit report.'))}</div>`;
      return;
    }
  }
  if (!report) {
    document.getElementById('creditReportContent').innerHTML = '<div style="color:#ff6b6b;text-align:center;padding:24px">Report unavailable.</div>';
    return;
  }
  document.getElementById('creditReportContent').innerHTML = buildCreditReportHtml(a, report);
}
function closeCreditReport() {
  document.getElementById('creditReportModal').classList.remove('show');
}

function renderReviewCreditSection(d) {
  const wrap = document.getElementById('reviewCreditWrap');
  const s = d.creditCheckStatus || 'NOT_REQUESTED';
  const header = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="material-symbols-outlined ms" style="font-size:16px;color:#00f0ff">fact_check</span><span style="font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:12.5px">Credit Check</span></div>`;
  if (s === 'COMPLETED') {
    // Band/color intentionally not recomputed here — that logic lives
    // server-side (functions/services/creditCheck.js's riskBand()); "View
    // Full Report" shows the complete band-colored breakdown.
    wrap.innerHTML = header + `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <span style="font-size:12px;color:#b9cacb">Score <b>${d.creditCheckScore}</b>/999</span>
        <button class="btng" style="font-size:11px;padding:5px 10px" onclick="viewCreditCheck('${escA(d.id)}')">View Full Report</button>
      </div>`;
    return;
  }
  if (s === 'DECLINED') {
    wrap.innerHTML = header + `<div style="font-size:12px;color:#ff6b6b">Credit check declined by admin. We are not liable for any resulting loss.</div>`;
    return;
  }
  if (s === 'REQUESTED') {
    wrap.innerHTML = header + `<div style="font-size:12px;color:#ffd93d;display:flex;align-items:center;gap:6px"><span class="material-symbols-outlined ms ccspin" style="font-size:14px">progress_activity</span>In progress — check back shortly.</div>`;
    return;
  }
  wrap.innerHTML = header + `
    <div style="font-size:12px;color:#849495;margin-bottom:9px">Not yet sent. Approval requires a completed or explicitly declined credit check.</div>
    ${_canEdit ? `<div style="display:flex;gap:8px">
      <button class="btnp" style="flex:1;justify-content:center;font-size:12px;padding:8px" onclick="sendForCreditCheck('${escA(d.id)}')">Send for Credit Check</button>
      <button class="btng" style="flex:1;justify-content:center;font-size:12px;padding:8px" onclick="declineCreditCheckFlow('${escA(d.id)}')">Decline Check</button>
    </div>` : ''}`;
}

// beginReject() below replaces reviewAppActions' innerHTML in place — reset
// it back to this canonical Approve/Decline pair on every open, otherwise
// re-opening the modal for a different application after a prior Decline
// click would leave it stuck showing "Confirm Decline"/"Cancel".
const REVIEW_ACTIONS_DEFAULT_HTML = `
  <button class="btnp" id="reviewApproveBtn" style="flex:1;justify-content:center;padding:11px" onclick="submitReview('APPROVED')">
    <span class="material-symbols-outlined ms" style="font-size:16px">check</span>Approve
  </button>
  <button class="btnr" style="flex:1;justify-content:center;padding:11px" onclick="beginReject()">
    <span class="material-symbols-outlined ms" style="font-size:16px">close</span>Decline
  </button>`;

let _reviewingAppId = null;
async function openReviewApp(id) {
  _reviewingAppId = id;
  document.getElementById('reviewAppErr').style.display = 'none';
  document.getElementById('rejectReasonWrap').style.display = 'none';
  document.getElementById('reviewAppActions').innerHTML = REVIEW_ACTIONS_DEFAULT_HTML;
  document.getElementById('reviewAppContent').innerHTML = '<div style="text-align:center;padding:20px;color:#849495">Loading…</div>';
  document.getElementById('reviewCreditWrap').innerHTML = '';
  document.getElementById('reviewAppModal').classList.add('show');

  let d;
  try {
    d = await DC_DATA.getRentalApplicationDetail(id);
  } catch {
    document.getElementById('reviewAppContent').innerHTML = '<div style="color:#ff6b6b">Could not load application details.</div>';
    return;
  }
  if (!d) { document.getElementById('reviewAppContent').innerHTML = '<div style="color:#ff6b6b">Application not found.</div>'; return; }

  document.getElementById('reviewAppSub').textContent = `${d.firstName} ${d.lastName} — ${d.equipmentName}`;
  const rows = [
    ['Email', d.email], ['Phone', d.phone], ['ID Number', d.idNumber],
    ['Address', [d.address, d.city, d.postalCode].filter(Boolean).join(', ')],
    ['Employment', (d.employmentStatus || '').replace(/_/g, ' ')], ['Employer', d.employerName],
    ['Monthly Income', d.monthlyIncome != null ? 'R ' + Math.round(d.monthlyIncome).toLocaleString() : '—'],
    ['Bank', d.bank], ['Equipment', d.equipmentName],
    ['Period', `${fmtDate(d.startDate)} – ${fmtDate(d.endDate)}`],
    ['Est. Cost', d.estimatedCost != null ? 'R ' + Math.round(d.estimatedCost).toLocaleString() : '—'],
    ['Delivery Address', d.deliveryAddress],
    ['Purpose', d.purpose],
  ];
  document.getElementById('reviewAppContent').innerHTML = rows.map(([k, v]) =>
    `<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
      <span style="color:#849495;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;flex-shrink:0">${esc(k)}</span>
      <span style="text-align:right">${esc(v || '—')}</span>
    </div>`).join('');

  renderReviewCreditSection(d);

  const actionsWrap = document.getElementById('reviewAppActions');
  const canReview = _canEdit && d.status === 'PENDING';
  actionsWrap.style.display = canReview ? 'flex' : 'none';
  if (canReview) {
    const resolved = d.creditCheckStatus === 'COMPLETED' || d.creditCheckStatus === 'DECLINED';
    const approveBtn = document.getElementById('reviewApproveBtn');
    approveBtn.disabled = !resolved;
    approveBtn.title = resolved ? '' : 'Resolve the credit check first';
    if (resolved) {
      approveBtn.className = 'btnp';
      approveBtn.style.cssText = 'flex:1;justify-content:center;padding:11px';
      approveBtn.innerHTML = '<span class="material-symbols-outlined ms" style="font-size:16px">check</span>Approve';
    } else {
      // Deliberately not just a dimmed btnp — a same-color-but-faded button
      // still reads as clickable at a glance. Swapping to the neutral
      // disabled style makes "you can't approve yet" obvious immediately.
      approveBtn.className = 'btng';
      approveBtn.style.cssText = 'flex:1;justify-content:center;padding:11px;opacity:.55;cursor:not-allowed;color:#849495';
      approveBtn.innerHTML = '<span class="material-symbols-outlined ms" style="font-size:16px">lock</span>Resolve Credit Check First';
    }
  }
}

function beginReject() {
  document.getElementById('rejectReasonWrap').style.display = 'block';
  document.getElementById('reviewAppActions').innerHTML = `
    <button class="btnr" style="flex:1;justify-content:center;padding:11px" onclick="submitReview('REJECTED')">Confirm Decline</button>
    <button class="btng" style="flex:1;justify-content:center;padding:11px" onclick="closeReviewApp()">Cancel</button>`;
}

async function submitReview(status) {
  const errBox = document.getElementById('reviewAppErr');
  errBox.style.display = 'none';
  const reason = status === 'REJECTED' ? document.getElementById('rejectReasonInput').value.trim() : null;
  try {
    await DC_DATA.reviewRentalApplication(_reviewingAppId, status, reason);
    closeReviewApp();
    renderApplications();
    window.showToast?.('success', status === 'APPROVED' ? 'Application approved.' : 'Application declined.');
  } catch (err) {
    errBox.textContent = EC_SECURITY.safeErrMsg(err, 'Could not update this application. Please try again.');
    errBox.style.display = 'block';
  }
}

function closeReviewApp() {
  document.getElementById('reviewAppModal').classList.remove('show');
  _reviewingAppId = null;
}
DC_DATA.init().then(renderAll).catch(err => {
  document.body.insertAdjacentHTML('afterbegin', `<div style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#ff6b6b;color:#000;padding:10px 16px;font-family:monospace;font-size:12px">⚠ Data Connect error: ${EC_SECURITY.sanitizeHtml(err.message)}</div>`);
});
DC_DATA.startPolling(renderAll, 5000);
</script>
</body></html>
