}

# ─── Users ────────────────────────────────────────────────────────────────────

mutation CreateUser(
  $name: String!
  $email: String!
  $role: UserRole!
  $organisationId: UUID
  $avatarUrl: String
  $phone: String
  $idNumber: String
  $dateOfBirth: Date
  $address: String
  $city: String
  $province: SaProvince
  $postalCode: String
  $employmentStatus: EmploymentStatus
  $employerName: String
  $monthlyIncome: Float
  $yearsEmployed: Int
  $bank: BankName
  $accountType: AccountType
  $outstandingCredit: Float
  $termsAcceptedAt: Timestamp
) @auth(level: NO_ACCESS) {
  user_insert(data: {
    name: $name
    email: $email
    role: $role
    organisationId: $organisationId
    status: ACTIVE
    avatarUrl: $avatarUrl
    emailVerified: false
    failedAttempts: 0
    phone: $phone
    idNumber: $idNumber
    dateOfBirth: $dateOfBirth
    address: $address
    city: $city
    province: $province
    postalCode: $postalCode
    employmentStatus: $employmentStatus
    employerName: $employerName
    monthlyIncome: $monthlyIncome
    yearsEmployed: $yearsEmployed
    bank: $bank
    accountType: $accountType
    outstandingCredit: $outstandingCredit
    termsAcceptedAt: $termsAcceptedAt
  })
}

mutation UpdateUserStatus($id: UUID!, $status: UserStatus!) @auth(level: NO_ACCESS) {
  user_update(id: $id, data: { status: $status, updatedAt_expr: "request.time" })
}

mutation UpdateUserRole($id: UUID!, $role: UserRole!) @auth(level: NO_ACCESS) {
  user_update(id: $id, data: { role: $role, updatedAt_expr: "request.time" })
}

mutation UpdateUserProfile(
  $id: UUID!
  $name: String
  $bio: String
  $position: String
  $department: String
  $phone: String
  $avatarUrl: String
  $idNumber: String
  $dateOfBirth: Date
  $address: String
  $city: String
  $province: SaProvince
  $postalCode: String
  $employmentStatus: EmploymentStatus
  $employerName: String
  $monthlyIncome: Float
  $yearsEmployed: Int
  $bank: BankName
  $accountType: AccountType
  $outstandingCredit: Float
) @auth(level: NO_ACCESS) {
  user_update(id: $id, data: {
    name: $name
    bio: $bio
    position: $position
    department: $department
    phone: $phone
    avatarUrl: $avatarUrl
    idNumber: $idNumber
    dateOfBirth: $dateOfBirth
    address: $address
    city: $city
    province: $province
    postalCode: $postalCode
    employmentStatus: $employmentStatus
    employerName: $employerName
    monthlyIncome: $monthlyIncome
    yearsEmployed: $yearsEmployed
    bank: $bank
    accountType: $accountType
