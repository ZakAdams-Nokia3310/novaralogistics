mutation RecordUserLogin($id: UUID!) @auth(level: NO_ACCESS) {
  user_update(id: $id, data: {
    lastLoginAt_expr: "request.time"
    failedAttempts: 0
    updatedAt_expr: "request.time"
  })
}

mutation RecordFailedLogin($id: UUID!, $failedAttempts: Int!, $lockedUntil: Timestamp) @auth(level: NO_ACCESS) {
  user_update(id: $id, data: {
    failedAttempts: $failedAttempts
    lockedUntil: $lockedUntil
    updatedAt_expr: "request.time"
  })
}

mutation DeleteUser($id: UUID!) @auth(level: NO_ACCESS) {
  user_delete(id: $id)
}

