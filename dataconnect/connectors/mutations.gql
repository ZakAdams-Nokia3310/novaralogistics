# ─── Rental Applications ──────────────────────────────────────────────────────

mutation CreateRentalApplication(
  $ref: String!
  $applicantUserId: UUID
  $organisationId: UUID
  # Personal
  $firstName: String!
  $lastName: String!
  $idNumber: String!
  $dateOfBirth: Date!
  $email: String!
  $phone: String!
  $address: String!
  $city: String
  $province: SaProvince
  $postalCode: String
  # Financial
  $employmentStatus: EmploymentStatus!
  $employerName: String!
  $monthlyIncome: Float!
  $yearsEmployed: Int
  $bank: BankName!
  $accountType: AccountType
  $outstandingCredit: Float
  $creditCheckConsent: Boolean
  # Equipment
  $vehicleId: UUID
  $equipmentName: String!
  $dailyRate: Float
  $startDate: Date!
  $endDate: Date!
  $estimatedCost: Float
  $deliveryAddress: String!
  $purpose: RentalPurpose
  $rentalNotes: String
  # Consent
  $consentCreditCheck: Boolean!
  $consentTerms: Boolean!
  $consentUnderstanding: Boolean!
) @auth(level: NO_ACCESS) {
  rentalApplication_insert(data: {
    ref: $ref
    applicantUserId: $applicantUserId
    organisationId: $organisationId
    status: PENDING
    firstName: $firstName
    lastName: $lastName
    idNumber: $idNumber
    dateOfBirth: $dateOfBirth
    email: $email
    phone: $phone
    address: $address
    city: $city
    province: $province
    postalCode: $postalCode
    employmentStatus: $employmentStatus
    employerName: $employerName
    monthlyIncome: $monthlyIncome
    yearsEmployed: $yearsEmployed
    bank: $bank
    accountType: $accountType
    outstandingCredit: $outstandingCredit
    creditCheckConsent: $creditCheckConsent
    vehicleId: $vehicleId
    equipmentName: $equipmentName
    dailyRate: $dailyRate
    startDate: $startDate
    endDate: $endDate
    estimatedCost: $estimatedCost
    deliveryAddress: $deliveryAddress
    purpose: $purpose
    rentalNotes: $rentalNotes
    consentCreditCheck: $consentCreditCheck
    consentTerms: $consentTerms
    consentUnderstanding: $consentUnderstanding
  })
}

mutation ReviewRentalApplication(
  $id: UUID!
  $status: ApplicationStatus!
  $reviewedById: UUID!
  $rejectionReason: String
) @auth(level: NO_ACCESS) {
  rentalApplication_update(id: $id, data: {
    status: $status
    reviewedById: $reviewedById
    rejectionReason: $rejectionReason
    reviewedAt_expr: "request.time"
    updatedAt_expr: "request.time"
  })
}

mutation RequestCreditCheck($id: UUID!) @auth(level: NO_ACCESS) {
  rentalApplication_update(id: $id, data: {
    creditCheckStatus: REQUESTED
    creditCheckRequestedAt_expr: "request.time"
    updatedAt_expr: "request.time"
  })
}

mutation CompleteMockCreditCheck($id: UUID!, $score: Int!) @auth(level: NO_ACCESS) {
