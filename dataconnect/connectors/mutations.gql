# EquipCore — Data Connect Mutations

# ─── Organisations ────────────────────────────────────────────────────────────

mutation CreateOrganisation(
  $name: String!
  $sector: String!
  $regId: String!
  $contactEmail: String!
  $domain: String!
  $logoUrl: String
) @auth(level: NO_ACCESS) {
  organisation_insert(data: {
    name: $name
    sector: $sector
    regId: $regId
    contactEmail: $contactEmail
    domain: $domain
    logoUrl: $logoUrl
    status: ACTIVE
  })
}

mutation UpdateOrgStatus($id: UUID!, $status: OrgStatus!) @auth(level: NO_ACCESS) {
  organisation_update(id: $id, data: { status: $status, updatedAt_expr: "request.time" })
}

mutation UpdateOrganisation(
  $id: UUID!
  $name: String
  $sector: String
  $contactEmail: String
  $domain: String
  $logoUrl: String
) @auth(level: NO_ACCESS) {
  organisation_update(id: $id, data: {
    name: $name
    sector: $sector
    contactEmail: $contactEmail
    domain: $domain
    logoUrl: $logoUrl
    updatedAt_expr: "request.time"
  })
}

mutation DeleteOrganisation($id: UUID!) @auth(level: NO_ACCESS) {
  organisation_delete(id: $id)
}

# ─── Org Requests ─────────────────────────────────────────────────────────────

mutation CreateOrgRequest(
  $orgName: String!
  $sector: String!
  $regId: String!
  $contactName: String!
  $contactEmail: String!
  $domain: String!
) @auth(level: NO_ACCESS) {
  orgRequest_insert(data: {
    orgName: $orgName
    sector: $sector
    regId: $regId
    contactName: $contactName
    contactEmail: $contactEmail
    domain: $domain
    status: PENDING
  })
}

mutation ApproveOrgRequest($id: UUID!, $resultingOrgId: UUID!, $adminNotes: String) @auth(level: NO_ACCESS) {
  orgRequest_update(id: $id, data: {
    status: APPROVED
    resultingOrgId: $resultingOrgId
    adminNotes: $adminNotes
    updatedAt_expr: "request.time"
  })
}

mutation RejectOrgRequest($id: UUID!, $adminNotes: String) @auth(level: NO_ACCESS) {
