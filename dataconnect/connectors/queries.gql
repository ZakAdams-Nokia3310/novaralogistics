# EquipCore — Data Connect Queries

# ─── Vehicles ─────────────────────────────────────────────────────────────────

query ListAllVehicles @auth(level: NO_ACCESS) {
  vehicles(orderBy: { updatedAt: DESC }) {
    id
    organisation {
      id
      name
    }
    assignedDriver {
      id
      name
    }
    make
    model
    year
    type
    regPlate
    description
    km
    serviceIntervalKm
    nextServiceKm
    status
    imageUrl
    vin
    trackingCompany
    lastServiceDate
    createdAt
    updatedAt
  }
}

query GetVehicleById($id: UUID!) @auth(level: NO_ACCESS) {
  vehicle(id: $id) {
    id
    organisation {
      id
      name
    }
    assignedDriver {
      id
      name
    }
    make
    model
    year
    type
    regPlate
    description
    km
    serviceIntervalKm
    nextServiceKm
    status
    imageUrl
    vin
    trackingCompany
    lastServiceDate
    createdAt
    updatedAt
  }
}

query ListVehiclesByStatus($status: VehicleStatus!) @auth(level: NO_ACCESS) {
  vehicles(where: { status: { eq: $status } }, orderBy: { make: ASC }) {
    id
    make
    model
    year
    type
    regPlate
    km
    status
    imageUrl
  }
}

query ListVehiclesByType($type: VehicleType!) @auth(level: NO_ACCESS) {
  vehicles(where: { type: { eq: $type } }, orderBy: { make: ASC }) {
    id
    make
    model
    year
    type
    regPlate
    status
    imageUrl
  }
}

# Added for the "user" dashboard's org-scoped vehicle count — the caller's
# own organisationId is enforced server-side (see
# functions/registry/dataOperations.js's orgField), never trusted from the
# client, so a non-admin can only ever see their own org's vehicles.
query ListVehiclesByOrg($organisationId: UUID!) @auth(level: NO_ACCESS) {
  vehicles(where: { organisationId: { eq: $organisationId } }, orderBy: { make: ASC }) {
    id
    organisation {
      id
      name
    }
    assignedDriver {
      id
      name
    }
    make
    model
    year
    type
    regPlate
    description
    km
    serviceIntervalKm
    nextServiceKm
    status
    imageUrl
    vin
    trackingCompany
    lastServiceDate
    createdAt
    updatedAt
  }
}

# ─── Rentals ──────────────────────────────────────────────────────────────────

query ListAllRentals @auth(level: NO_ACCESS) {
  rentals(orderBy: { updatedAt: DESC }) {
    id
    vehicle {
      id
      make
      model
      regPlate
    }
    equipmentName
    clientName
    organisation {
      id
      name
    }
    startDate
    returnDate
    valueZar
    status
    notes
    application {
      id
      ref
      status
      submittedAt
      reviewedAt
      reviewedBy {
        name
      }
      rejectionReason
    }
    createdAt
    updatedAt
  }
}

# Used only by jobs/dailyRentalCheck.js's scheduled sweep — see
# functions/gql/queries.gql's copy of this same operation for why it's
# exempt from the registry/validation layer every client-reachable
# operation goes through.
query ListActiveRentals @auth(level: NO_ACCESS) {
  rentals(where: { status: { eq: ACTIVE } }) {
    id
    equipmentName
    returnDate
    application {
      ref
      applicantUser {
        id
        email
      }
    }
  }
}

query ListRentalEvents($rentalId: UUID!, $organisationId: UUID!) @auth(level: NO_ACCESS) {
  rentalEvents(
    where: { rentalId: { eq: $rentalId }, rental: { organisationId: { eq: $organisationId } } }
    orderBy: { createdAt: ASC }
  ) {
    id
    type
    description
    fromStatus
    toStatus
    actorUser {
      name
    }
    createdAt
  }
}

query GetRentalById($id: UUID!) @auth(level: NO_ACCESS) {
  rental(id: $id) {
    id
    vehicle {
      id
      make
      model
      regPlate
      type
      imageUrl
    }
    equipmentName
    clientName
    organisation {
      id
      name
      contactEmail
    }
    startDate
    returnDate
    valueZar
    status
    notes
