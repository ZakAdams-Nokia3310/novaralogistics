query ListAllUsers @auth(level: NO_ACCESS) {
  users(orderBy: { name: ASC }) {
    id
    name
    email
    role
    organisation {
      id
      name
    }
    status
    avatarUrl
    bio
    position
    department
    phone
    customRole {
      id
      name
    }
    totpEnabled
    createdAt
    updatedAt
  }
}

query GetUserById($id: UUID!) @auth(level: NO_ACCESS) {
  user(id: $id) {
    id
    name
    email
    role
    organisation {
      id
      name
    }
