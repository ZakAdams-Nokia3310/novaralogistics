}

query ListAuditLogsByUser($userId: UUID!) @auth(level: NO_ACCESS) {
  auditLogs(
    where: { userId: { eq: $userId } }
    orderBy: { createdAt: DESC }
  ) {
    id
    userName
    userRole
    action
    details
    page
    createdAt
  }
}

