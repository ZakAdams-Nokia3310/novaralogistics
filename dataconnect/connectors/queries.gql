# ─── Maintenance ──────────────────────────────────────────────────────────────

query ListAllMaintenanceQueries @auth(level: PUBLIC, insecureReason: "Admin pages handle their own session guard.") {
  maintenanceQueries(orderBy: { updatedAt: DESC }) {
    id
    vehicle {
      id
      make
      model
      regPlate
    }
    vehicleLabel
    loggedByName
    loggedByUser {
      id
      name
    }
    type
    description
    priority
    status
    resolvedAt
    updatedAt
  }
}

query GetMaintenanceById($id: UUID!) @auth(level: PUBLIC, insecureReason: "Admin pages handle their own session guard.") {
  maintenanceQuery(id: $id) {
    id
    vehicle {
      id
      make
      model
      regPlate
      type
    }
    vehicleLabel
    loggedByName
    loggedByUser {
      id
      name
      email
    }
    type
    description
    priority
    status
    resolvedAt
    updatedAt
  }
}

query ListMaintenanceByVehicle($vehicleId: UUID!) @auth(level: PUBLIC, insecureReason: "Admin pages handle their own session guard.") {
  maintenanceQueries(
    where: { vehicleId: { eq: $vehicleId } }
    orderBy: { updatedAt: DESC }
  ) {
    id
    type
    description
    priority
    status
    loggedByName
    createdAt
    resolvedAt
  }
}

query ListMaintenanceByStatus($status: MaintenanceStatus!) @auth(level: PUBLIC, insecureReason: "Admin pages handle their own session guard.") {
  maintenanceQueries(
    where: { status: { eq: $status } }
    orderBy: { priority: DESC }
  ) {
    id
    vehicle {
      id
      make
      model
      regPlate
    }
    type
    description
    priority
    status
    createdAt
  }
}

query ListMaintenanceByPriority($priority: MaintenancePriority!) @auth(level: PUBLIC, insecureReason: "Admin pages handle their own session guard.") {
  maintenanceQueries(
    where: {
      _and: [
        { priority: { eq: $priority } }
        { status: { ne: RESOLVED } }
      ]
    }
    orderBy: { updatedAt: DESC }
  ) {
    id
    vehicle {
      id
      make
      model
      regPlate
    }
    type
    description
    priority
    status
    createdAt
  }
}

