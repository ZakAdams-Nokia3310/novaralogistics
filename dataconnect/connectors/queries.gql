query GetUserByEmail($email: String!) @auth(level: NO_ACCESS) {
  users(where: { email: { eq: $email } }, limit: 1) {
    id
    name
    email
    role
    organisation { id name }
    status
    avatarUrl
    bio
    position
    department
    phone
    idNumber
    dateOfBirth
    address
    city
    province
    postalCode
    employmentStatus
    employerName
    monthlyIncome
    yearsEmployed
    bank
    accountType
    outstandingCredit
    termsAcceptedAt
    createdAt
    customRole { id name permissions }
  }
}

query ListAllRoles @auth(level: NO_ACCESS) {
  roles(orderBy: { name: ASC }) {
    id
    name
    description
    permissions
    createdBy { id name }
    createdAt
    updatedAt
  }
}

query GetRoleById($id: UUID!) @auth(level: NO_ACCESS) {
  role(id: $id) {
    id
    name
    permissions
  }
}

# Never exposed via any client-reachable operation — only used internally
# by controllers/totpController.js. Returns the encrypted secret/backup
# codes, so this must stay unreachable even to a signed-in client.
query GetUserTotpByEmail($email: String!) @auth(level: NO_ACCESS) {
  users(where: { email: { eq: $email } }, limit: 1) {
    id
    role
    totpEnabled
    totpSecretEnc
    totpBackupCodesEnc
    totpVerifiedAt
  }
}

query ListUsersByRole($role: UserRole!) @auth(level: NO_ACCESS) {
  users(
    where: { role: { eq: $role } }
    orderBy: { name: ASC }
  ) {
    id
    name
    email
    role
    status
    avatarUrl
  }
}

# ─── Maintenance ──────────────────────────────────────────────────────────────

query ListAllMaintenanceQueries @auth(level: NO_ACCESS) {
  maintenanceQueries(orderBy: { updatedAt: DESC }) {
    id
    vehicle {
      id
      make
      model
      regPlate
    }
    vehicleLabel
    loggedByName
    loggedByUser {
      id
      name
    }
    type
    description
    priority
    status
    resolvedAt
    createdAt
    updatedAt
  }
}

query GetMaintenanceById($id: UUID!) @auth(level: NO_ACCESS) {
  maintenanceQuery(id: $id) {
    id
    vehicle {
      id
      make
      model
      regPlate
      type
    }
    vehicleLabel
    loggedByName
    loggedByUser {
      id
      name
      email
    }
    type
    description
    priority
    status
    resolvedAt
    updatedAt
  }
}

query ListMaintenanceByVehicle($vehicleId: UUID!) @auth(level: NO_ACCESS) {
  maintenanceQueries(
    where: { vehicleId: { eq: $vehicleId } }
    orderBy: { updatedAt: DESC }
  ) {
    id
    type
    description
    priority
    status
    loggedByName
    createdAt
    resolvedAt
  }
}

query ListMaintenanceByStatus($status: MaintenanceStatus!) @auth(level: NO_ACCESS) {
  maintenanceQueries(
    where: { status: { eq: $status } }
    orderBy: { priority: DESC }
  ) {
    id
    vehicle {
      id
      make
      model
      regPlate
    }
    type
    description
    priority
    status
    createdAt
  }
}

query ListMaintenanceByPriority($priority: MaintenancePriority!) @auth(level: NO_ACCESS) {
  maintenanceQueries(
    where: {
      _and: [
        { priority: { eq: $priority } }
        { status: { ne: RESOLVED } }
      ]
    }
    orderBy: { updatedAt: DESC }
  ) {
    id
    vehicle {
      id
      make
      model
      regPlate
    }
    type
    description
    priority
    status
    createdAt
  }
}

