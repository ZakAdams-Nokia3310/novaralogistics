# EquipCore — Data Connect Queries

# ─── Vehicles ─────────────────────────────────────────────────────────────────

query ListAllVehicles @auth(level: PUBLIC, insecureReason: "Admin pages handle their own session guard.") {
  vehicles(orderBy: { updatedAt: DESC }) {
    id
    organisation {
      id
      name
    }
    make
    model
    year
    type
    regPlate
    km
    serviceIntervalKm
    nextServiceKm
    status
    imageUrl
    createdAt
    updatedAt
  }
}

query GetVehicleById($id: UUID!) @auth(level: PUBLIC, insecureReason: "Admin pages handle their own session guard.") {
  vehicle(id: $id) {
    id
    make
    model
    year
    type
    regPlate
    km
    serviceIntervalKm
    nextServiceKm
    status
    imageUrl
    createdAt
    updatedAt
  }
}

query ListVehiclesByStatus($status: VehicleStatus!) @auth(level: PUBLIC, insecureReason: "Admin pages handle their own session guard.") {
  vehicles(where: { status: { eq: $status } }, orderBy: { make: ASC }) {
    id
    make
    model
    year
    type
    regPlate
    km
    status
    imageUrl
  }
}

query ListVehiclesByType($type: VehicleType!) @auth(level: PUBLIC, insecureReason: "Admin pages handle their own session guard.") {
  vehicles(where: { type: { eq: $type } }, orderBy: { make: ASC }) {
    id
    make
    model
    year
    type
    regPlate
    status
    imageUrl
  }
}

