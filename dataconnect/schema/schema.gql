# EquipCore — Firebase Data Connect Schema
# Backend: Cloud SQL (PostgreSQL) via Firebase Data Connect
# Images and documents live in Firebase Storage; only the download URL is stored here.

# ─── Enums ────────────────────────────────────────────────────────────────────

enum UserRole {
  ADMIN
  USER
  DRIVER
  GUEST
}

enum UserStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
}

enum OrgStatus {
  ACTIVE
  SUSPENDED
}

enum OrgRequestStatus {
  PENDING
  APPROVED
  REJECTED
}

enum VehicleType {
  # Original 13 values, kept in their exact original relative order — a
  # Postgres ALTER TYPE ... ADD VALUE only stays cheap (metadata-only, no
  # table rewrite) when existing values don't change position; reordering
  # them (even just adding new ones between/before old ones) forces Data
  # Connect into a full type-recreation-and-column-recast migration instead,
  # which timed out repeatedly on this project's small instance. All new SA
  # categories are appended after, never interleaved.
  EXCAVATOR
  ARTICULATED_HAULER
  WHEEL_LOADER
  HEAVY_TRUCK
  BACKHOE_LOADER
  DRILL_RIG
  CRANE
  FORKLIFT
  GENERATOR
  HIGH_REACH_TRUCK
  CONTAINER_REACHSTACKER
  VAN
  OTHER
  RIGID_TRUCK
  TIPPER_TRUCK
  SIDE_TIPPER
  RIGID_DUMP_TRUCK
  CONCRETE_MIXER
  CRANE_TRUCK
  ROAD_SWEEPER
  WATER_BOWSER
  FLATBED_TRUCK
  CURTAINSIDER_TRUCK
  REFRIGERATED_TRUCK
  TANKER_TRUCK
  CAR_TRANSPORTER
  ASPHALT_PAVER
  COLD_PLANER
  CONCRETE_PUMP
  SUPERLINK
  HORSE_TRAILER
  FLATBED_TRAILER
  CURTAINSIDER_TRAILER
  REFRIGERATED_TRAILER
  TANKER_TRAILER
  TIPPER_TRAILER
  LOWBOY_TRAILER
  SKELETAL_TRAILER
  CAR_TRANSPORTER_TRAILER
  MINI_EXCAVATOR
  COMPACT_TRACK_LOADER
  SKID_STEER_LOADER
  BULLDOZER
  MOTOR_GRADER
  COMPACTOR
  CRUSHER
  SCREENING_PLANT
  MOBILE_CRANE
  TOWER_CRANE
  CRAWLER_CRANE
  OVERHEAD_CRANE
  BOOM_TRUCK
  ROUGH_TERRAIN_FORKLIFT
  ORDER_PICKER
  PALLET_JACK
  TELEHANDLER
  SCISSOR_LIFT
  BOOM_LIFT
  STRADDLE_CARRIER
  COMPRESSOR
  LIGHT_TOWER
  WATER_PUMP
  TRACTOR
  AGRICULTURAL_IMPLEMENT
  IRRIGATION_EQUIPMENT
  PICKUP_TRUCK
  MINIBUS
}

