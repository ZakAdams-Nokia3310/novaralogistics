# ─── Organisation ─────────────────────────────────────────────────────────────

type Organisation @table(name: "organisations") {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @col(dataType: "varchar(200)")
  sector: String! @col(dataType: "varchar(100)")
  regId: String! @col(dataType: "varchar(50)") @unique
  contactEmail: String! @col(dataType: "varchar(200)")
  domain: String! @col(dataType: "varchar(200)") @unique
  logoUrl: String
  status: OrgStatus! @default(value: ACTIVE)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ─── OrgRequest ───────────────────────────────────────────────────────────────

type OrgRequest @table(name: "org_requests") {
  id: UUID! @default(expr: "uuidV4()")
  orgName: String! @col(dataType: "varchar(200)")
  sector: String! @col(dataType: "varchar(100)")
  regId: String! @col(dataType: "varchar(50)")
  contactName: String! @col(dataType: "varchar(200)")
  contactEmail: String! @col(dataType: "varchar(200)")
  domain: String! @col(dataType: "varchar(200)")
  status: OrgRequestStatus! @default(value: PENDING)
  adminNotes: String @col(dataType: "text")
  resultingOrg: Organisation
  submittedAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ─── User ─────────────────────────────────────────────────────────────────────

type User @table(name: "users") {
  id: UUID! @default(expr: "uuidV4()")
  firebaseUid: String @col(dataType: "varchar(128)") @unique
  name: String! @col(dataType: "varchar(200)")
  email: String! @col(dataType: "varchar(200)") @unique
  role: UserRole! @default(value: USER)
  organisation: Organisation
  status: UserStatus! @default(value: ACTIVE)
  avatarUrl: String
  bio: String @col(dataType: "text")
  position: String @col(dataType: "varchar(200)")
  department: String @col(dataType: "varchar(200)")
  phone: String @col(dataType: "varchar(30)")
  # ── KYC / rental-readiness fields — collected at signup (signup.html) or
  # profile.html, and auto-filled into apply-rental.html's application form
  # so a returning applicant never has to re-type them. All nullable: a
  # pre-existing account or a Google-auto-registered one may have none of
  # this yet, and apply-rental.html still asks for (and can save back)
  # whatever's missing at application time.
  idNumber: String @col(dataType: "varchar(20)")
  dateOfBirth: Date
  address: String @col(dataType: "varchar(400)")
  city: String @col(dataType: "varchar(100)")
  province: SaProvince
  postalCode: String @col(dataType: "varchar(10)")
  employmentStatus: EmploymentStatus
  employerName: String @col(dataType: "varchar(200)")
  monthlyIncome: Float
  yearsEmployed: Int
  bank: BankName
  accountType: AccountType
  outstandingCredit: Float
  # Timestamped when the user ticks the signup consent box — a record of
  # WHEN they accepted, not just that they did, for compliance purposes.
  termsAcceptedAt: Timestamp
  emailVerified: Boolean! @default(value: false)
  lastLoginAt: Timestamp
  failedAttempts: Int! @default(value: 0)
  lockedUntil: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
  # TOTP two-factor auth (required for admin accounts, "occasional" beyond
  # that — see functions/services/totp.js). Secret and backup codes are
  # never readable by any client operation — only functions/gql/queries.gql's
  # server-only GetUserTotpByEmail can see them, executed via the Admin SDK.
  totpEnabled: Boolean! @default(value: false)
  totpSecretEnc: String @col(dataType: "text")
  totpBackupCodesEnc: String @col(dataType: "text")
  totpVerifiedAt: Timestamp
  # Optional, additive on top of `role` above — grants access to specific
  # admin pages without making someone a full admin (e.g. a "Reception"
  # role that can view Rentals but nothing else). See Role below.
  customRole: Role
}

# ─── Custom roles ───────────────────────────────────────────────────────────────
# Admin-defined roles beyond the fixed admin/user/driver/guest set — grant
# scoped access to specific admin pages, view-only or edit, without making
# someone a full admin. The 4 built-in roles above are untouched by this;
# a custom role is assigned to a User in ADDITION to their base role.

type Role @table(name: "roles") {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @col(dataType: "varchar(100)") @unique
  description: String @col(dataType: "text")
  # JSON object: { "admin-fleet": "view", "admin-rentals": "edit", ... } —
  # keys are the same page slugs used in security.js's PAGE_ROLES; a key
  # absent from this object means no access at all. One column, not a join
  # table — this data is small and bounded, and a single save avoids N
  # separate mutation calls per role edit.
  permissions: String! @col(dataType: "text")
  createdBy: User
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ─── Vehicle ──────────────────────────────────────────────────────────────────

type Vehicle @table(name: "vehicles") {
  id: UUID! @default(expr: "uuidV4()")
  organisation: Organisation
  # Nullable — most vehicles have no driver assigned. Set via
  # AssignDriverToVehicle (admin-fleet.html's vehicle-detail edit page);
  # driver-facing pages (dashboard-driver.html, driver-vehicles.html) use
  # this to find "my vehicle" instead of guessing from rental status.
  assignedDriver: User
  make: String! @col(dataType: "varchar(100)")
  model: String! @col(dataType: "varchar(200)")
  year: Int!
  type: VehicleType!
  regPlate: String! @col(dataType: "varchar(20)") @unique
  description: String @col(dataType: "text")
  km: Int! @default(value: 0)
  serviceIntervalKm: Int!
  nextServiceKm: Int!
  status: VehicleStatus! @default(value: AVAILABLE)
  imageUrl: String
  vin: String @col(dataType: "varchar(50)")
  trackingCompany: String @col(dataType: "varchar(100)")
  lastServiceDate: Date
  # ── Marketplace listing (all nullable — a vehicle with none of these set
  # simply doesn't appear in marketplace browsing/filtering; the org-scoped
  # rent-equipment.html flow is completely unaffected by any of this). ──
  province: SaProvince
  hireMode: HireMode
  operatorIncluded: Boolean
  fuelIncluded: Boolean
  transportIncluded: Boolean
  hourlyRate: Float
  dailyRate: Float
  weeklyRate: Float
  monthlyRate: Float
  # Who owns/lists this equipment — deliberately a SEPARATE field from
  # `organisation` above, which means "which customer org is scoped to see/
  # rent this" (see rent-equipment.html's ListVehiclesByOrg usage) and must
  # keep that exact meaning unchanged. Null means "the platform operator's
  # own fleet" — no backfill needed on existing rows.
  supplierOrganisation: Organisation
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ─── VehicleImage ─────────────────────────────────────────────────────────────

type VehicleImage @table(name: "vehicle_images") {
  id: UUID! @default(expr: "uuidV4()")
  vehicle: Vehicle!
  imageUrl: String!
  caption: String @col(dataType: "varchar(300)")
  sortOrder: Int! @default(value: 0)
  uploadedAt: Timestamp! @default(expr: "request.time")
}

# ─── MaintenanceQuery ─────────────────────────────────────────────────────────

type MaintenanceQuery @table(name: "maintenance_queries") {
  id: UUID! @default(expr: "uuidV4()")
  vehicle: Vehicle!
  vehicleLabel: String! @col(dataType: "varchar(300)")
  type: MaintenanceType!
  description: String! @col(dataType: "text")
  priority: MaintenancePriority! @default(value: MEDIUM)
  status: MaintenanceStatus! @default(value: OPEN)
  loggedByName: String! @col(dataType: "varchar(200)")
  loggedByUser: User
  issueImageUrl: String
  resolvedBy: User
  resolutionNotes: String @col(dataType: "text")
  resolvedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ─── Rental ───────────────────────────────────────────────────────────────────

type Rental @table(name: "rentals") {
  id: UUID! @default(expr: "uuidV4()")
  vehicle: Vehicle
  equipmentName: String! @col(dataType: "varchar(200)")
  clientName: String! @col(dataType: "varchar(200)")
  organisation: Organisation
  startDate: Date!
  returnDate: Date!
  valueZar: Float! @default(value: 0)
  status: RentalStatus! @default(value: PENDING)
  notes: String @col(dataType: "text")
  # Set when this Rental was auto-created from an approved RentalApplication
  # (see functions/controllers/dataController.js's createRentalForApprovedApplication)
  # — null for a walk-in/manual rental created directly via admin-rentals.html's
  # "Add Rental", which has no prior application.
  application: RentalApplication
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ─── RentalEvent ──────────────────────────────────────────────────────────────
# Timeline entries for a Rental, shown to the customer (my-rentals.html) and
# the admin (rental-detail.html). "Application submitted"/"reviewed" entries
# are NOT stored here — the UI synthesizes those directly from
# RentalApplication's own submittedAt/status/reviewedAt/reviewedBy fields via
# Rental.application, avoiding duplicated data.

enum RentalEventType {
  CREATED
  STATUS_CHANGED
  NOTE
}

type RentalEvent @table(name: "rental_events") {
  id: UUID! @default(expr: "uuidV4()")
  rental: Rental!
  type: RentalEventType!
  description: String! @col(dataType: "text")
  fromStatus: RentalStatus
  toStatus: RentalStatus
  actorUser: User
  createdAt: Timestamp! @default(expr: "request.time")
}

# ─── RentalApplication ────────────────────────────────────────────────────────

type RentalApplication @table(name: "rental_applications") {
  id: UUID! @default(expr: "uuidV4()")
  ref: String! @col(dataType: "varchar(20)") @unique
  applicantUser: User
  organisation: Organisation
  status: ApplicationStatus! @default(value: PENDING)
  firstName: String! @col(dataType: "varchar(100)")
  lastName: String! @col(dataType: "varchar(100)")
  idNumber: String! @col(dataType: "varchar(20)")
  dateOfBirth: Date!
  email: String! @col(dataType: "varchar(200)")
  phone: String! @col(dataType: "varchar(30)")
  address: String! @col(dataType: "varchar(400)")
  city: String @col(dataType: "varchar(100)")
  province: SaProvince
  postalCode: String @col(dataType: "varchar(10)")
  employmentStatus: EmploymentStatus!
  employerName: String! @col(dataType: "varchar(200)")
  monthlyIncome: Float!
  yearsEmployed: Int
  bank: BankName!
  accountType: AccountType! @default(value: CHEQUE)
  outstandingCredit: Float! @default(value: 0)
  creditCheckConsent: Boolean! @default(value: false)
  vehicle: Vehicle
  equipmentName: String! @col(dataType: "varchar(200)")
  dailyRate: Float
  startDate: Date!
  endDate: Date!
  estimatedCost: Float
  deliveryAddress: String! @col(dataType: "varchar(400)")
  purpose: RentalPurpose
  rentalNotes: String @col(dataType: "text")
  consentCreditCheck: Boolean! @default(value: false)
  consentTerms: Boolean! @default(value: false)
  consentUnderstanding: Boolean! @default(value: false)
  idDocumentUrl: String
  proofOfIncomeUrl: String
  supportingDocUrl: String
  reviewedBy: User
  reviewedAt: Timestamp
  rejectionReason: String @col(dataType: "text")
  # ── Credit check (admin-triggered, distinct from creditCheckConsent/
  # consentCreditCheck above, which just record the applicant's own consent
  # at submission time) — see functions/services/creditCheck.js. Mock
  # provider for now: creditCheckScore is generated, not from a real bureau.
  creditCheckStatus: CreditCheckStatus! @default(value: NOT_REQUESTED)
  creditCheckScore: Int
  creditCheckFeeZar: Float @default(value: 250)
  creditCheckRequestedAt: Timestamp
  creditCheckCompletedAt: Timestamp
  # True once an admin has explicitly confirmed the liability warning shown
  # when skipping the check — never set any other way.
  creditCheckDeclinedAcknowledged: Boolean! @default(value: false)
  submittedAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ─── Notification ─────────────────────────────────────────────────────────────
# Created server-side at the same key transitions RentalEvent already logs
# (application submitted/approved/rejected, credit-check requested/completed/
# declined, rental status changed) — see controllers/dataController.js's
# createNotification(). linkPath lets the frontend deep-link the bell
# dropdown straight to the relevant page (e.g. "my-rentals" or
# "admin-rentals").

enum NotificationType {
  APPLICATION_STATUS
  RENTAL_STATUS
  CREDIT_CHECK
  MAINTENANCE
}

type Notification @table(name: "notifications") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  type: NotificationType!
  title: String! @col(dataType: "varchar(200)")
  body: String! @col(dataType: "text")
  linkPath: String @col(dataType: "varchar(200)")
  read: Boolean! @default(value: false)
  createdAt: Timestamp! @default(expr: "request.time")
}

# ─── CatalogItem ──────────────────────────────────────────────────────────────

type CatalogItem @table(name: "catalog_items") {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @col(dataType: "varchar(200)")
  subtitle: String @col(dataType: "varchar(200)")
  category: CatalogCategory!
  description: String @col(dataType: "text")
  specs: String @col(dataType: "text")
  dailyRate: Float!
  status: VehicleStatus! @default(value: AVAILABLE)
  availableFrom: Date
  imageUrl: String!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ─── CatalogImage ─────────────────────────────────────────────────────────────

type CatalogImage @table(name: "catalog_images") {
  id: UUID! @default(expr: "uuidV4()")
  catalogItem: CatalogItem!
  imageUrl: String!
  caption: String @col(dataType: "varchar(300)")
  sortOrder: Int! @default(value: 0)
  uploadedAt: Timestamp! @default(expr: "request.time")
}

# ─── WaitlistEntry ────────────────────────────────────────────────────────────

type WaitlistEntry @table(name: "waitlist_entries") {
  id: UUID! @default(expr: "uuidV4()")
  catalogItem: CatalogItem!
  user: User
  name: String! @col(dataType: "varchar(200)")
  email: String! @col(dataType: "varchar(200)")
  phone: String @col(dataType: "varchar(30)")
  status: WaitlistStatus! @default(value: PENDING)
  submittedAt: Timestamp! @default(expr: "request.time")
  notifiedAt: Timestamp
}

# ─── ContactInquiry ───────────────────────────────────────────────────────────

type ContactInquiry @table(name: "contact_inquiries") {
  id: UUID! @default(expr: "uuidV4()")
  referenceId: String! @col(dataType: "varchar(20)") @unique
  name: String! @col(dataType: "varchar(200)")
  email: String! @col(dataType: "varchar(200)")
  subject: String! @col(dataType: "varchar(300)")
  message: String! @col(dataType: "text")
  status: InquiryStatus! @default(value: NEW)
  repliedBy: User
  repliedAt: Timestamp
  submittedAt: Timestamp! @default(expr: "request.time")
}

# ─── AuditLog ─────────────────────────────────────────────────────────────────

type AuditLog @table(name: "audit_logs") {
  id: UUID! @default(expr: "uuidV4()")
  user: User
  userName: String @col(dataType: "varchar(200)")
  userRole: String @col(dataType: "varchar(50)")
  action: String! @col(dataType: "varchar(100)")
  details: String @col(dataType: "text")
  page: String @col(dataType: "varchar(200)")
  ipAddress: String @col(dataType: "varchar(45)")
  userAgent: String @col(dataType: "varchar(500)")
  createdAt: Timestamp! @default(expr: "request.time")
}
