<!DOCTYPE html>
<html class="dark" lang="en"><head><script src="canonical-redirect.js"></script>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<title>Reporting — EquipCore Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="theme.css" rel="stylesheet"/>
<script src="https://unpkg.com/apexcharts"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;}
  body{font-family:'Inter',sans-serif;color:#e2e2e8;min-height:100vh;}
  .ms{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  .glass{background:rgba(255,255,255,.05);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.09);}
  .glass-lo{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);}
  #sidebar-root{width:220px;height:100vh;position:fixed;left:0;top:0;z-index:50;display:flex;flex-direction:column;background:rgba(5,7,11,.94);border-right:1px solid rgba(255,255,255,.06);}
  .main{margin-left:220px;min-height:100vh;}
  .topbar{height:56px;position:sticky;top:0;z-index:40;background:rgba(8,10,14,.85);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;padding:0 26px;}
  .body{padding:22px 26px;}
  .tab-btn{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:8px 16px;border-radius:9px;border:1px solid rgba(255,255,255,.07);background:none;color:#849495;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:7px;}
  .tab-btn.active{background:rgba(0,240,255,.09);color:#00f0ff;border-color:rgba(0,240,255,.2);}
  .statCard{border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;}
  .statVal{font-family:'Hanken Grotesk',sans-serif;font-size:22px;font-weight:800;}
  .statLabel{font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.08em;}
  .panelTitle{font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .miniStat{border-radius:11px;padding:13px 15px;}
  .miniStat .v{font-family:'Hanken Grotesk',sans-serif;font-size:19px;font-weight:800;}
  .miniStat .l{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#849495;text-transform:uppercase;letter-spacing:.07em;margin-top:2px;}
  .barRow{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .barRow .lbl{width:150px;flex-shrink:0;font-size:12px;color:#b9cacb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .barRow .track{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden;}
  .barRow .fill{height:100%;border-radius:5px;}
  .barRow .n{width:34px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:#849495;flex-shrink:0;}
  .tbl{width:100%;border-collapse:collapse;}
  .tbl th{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#849495;padding:9px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05);}
  .tbl td{padding:9px 12px;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.03);}
  label{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#849495;text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:5px;}
  select,input[type=date]{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:9px;color:#e2e2e8;font-family:'Inter',sans-serif;font-size:12.5px;padding:8px 10px;outline:none;}
  .btnx{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;background:rgba(255,255,255,.05);color:#b9cacb;font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;border-radius:8px;border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:background .18s;white-space:nowrap;}
  .btnx:hover{background:rgba(255,255,255,.09);}
  .toolbar{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;}
  @media(max-width:768px){#sidebar-root{display:none!important}.main{margin-left:0!important}}
  @media(max-width:600px){
    .body{padding:14px 12px!important}
    .topbar{padding:0 14px!important;height:auto!important;min-height:56px;gap:6px}
    #kpiRow{grid-template-columns:repeat(2,1fr)!important}
    .tab-btn{font-size:10px!important;padding:6px 10px!important;gap:5px}
    .grid2,.grid3{grid-template-columns:1fr!important}
    .toolbar{flex-direction:column;align-items:stretch!important}
  }
</style>
</head>
<body>
<aside id="sidebar-root"></aside>

<div class="main">
  <div class="topbar">
    <div>
      <div style="font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:15px">Reporting</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495">Metrics across every feature — filter, drill in, and build your own cut below</div>
    </div>
  </div>

  <div class="body">
    <!-- Global filters — apply to every tab -->
    <div class="glass toolbar" style="border-radius:13px;padding:14px 18px;margin-bottom:16px">
      <div>
        <label>Date Range</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap" id="rangePresets"></div>
      </div>
      <div id="customRangeBox" style="display:none;gap:10px;align-items:flex-end">
        <div><label>From</label><input type="date" id="rangeFrom" onchange="onCustomRangeChange()"/></div>
        <div><label>To</label><input type="date" id="rangeTo" onchange="onCustomRangeChange()"/></div>
      </div>
      <div style="margin-left:auto;min-width:220px">
        <label>Organisation</label>
        <select id="orgFilterSel" onchange="onOrgFilterChange()" style="width:100%"></select>
      </div>
    </div>

    <div id="kpiRow" style="display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:20px"></div>

    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap" id="tabBar"></div>

    <div id="panelFleet"></div>
    <div id="panelRentals" style="display:none"></div>
    <div id="panelApplications" style="display:none"></div>
    <div id="panelMaintenance" style="display:none"></div>
    <div id="panelDrivers" style="display:none"></div>
    <div id="panelOrgs" style="display:none"></div>
    <div id="panelUsers" style="display:none"></div>
    <div id="panelNotifications" style="display:none"></div>
    <div id="panelActivity" style="display:none"></div>
    <div id="panelFlagged" style="display:none"></div>
    <div id="panelCustom" style="display:none"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="security.js"></script>
<script src="auth.js"></script>
<script src="frontend/token-client.js"></script>
<script src="dc.js?v=2"></script>
<script src="sidebar.js?v=2"></script>
<script src="bg.js"></script>
<script src="transitions.js"></script>
<script>
buildSidebar('admin-reports');
const _ecUser = EC_AUTH.require(['admin']);
const esc = EC_SECURITY.sanitizeHtml;
DC_DATA.setOrgScope(_ecUser.orgId);

const TABS = [
  { key: 'Fleet',        icon: 'garage' },
  { key: 'Rentals',      icon: 'receipt_long' },
  { key: 'Applications', icon: 'assignment' },
  { key: 'Maintenance',  icon: 'build' },
  { key: 'Drivers',      icon: 'badge' },
  { key: 'Orgs',         icon: 'domain', label: 'Organisations' },
  { key: 'Users',        icon: 'group', label: 'Users & Access' },
  { key: 'Notifications',icon: 'notifications' },
  { key: 'Activity',     icon: 'history' },
  { key: 'Custom',       icon: 'tune', label: 'Custom Report' },
];
// Platform-owner-only — every request/action that was attempted and DIDN'T
// go through (auth failures, permission denials, rate limiting, bot checks,
// TOTP failures) across both the admin and user sides. Not part of the
// regular Activity tab's scope (that's a general log; this is specifically
// "what got rejected and might need attention") and not shown to regular
// admins at all, matching the same platform-owner-only split used for org
// creation/approval/suspend elsewhere in this app.
if (EC_SECURITY.isSuperAdmin()) TABS.push({ key: 'Flagged', icon: 'flag' });

document.getElementById('tabBar').innerHTML = TABS.map((t, i) =>
  `<button class="tab-btn${i === 0 ? ' active' : ''}" id="tab${t.key}" onclick="switchTab('${t.key}')">
    <span class="material-symbols-outlined ms" style="font-size:15px">${t.icon}</span>${t.label || t.key}
  </button>`).join('');

let activeTab = 'Fleet';
function switchTab(key) {
  activeTab = key;
  TABS.forEach(t => {
    document.getElementById('panel' + t.key).style.display = t.key === key ? '' : 'none';
    document.getElementById('tab' + t.key).className = 'tab-btn' + (t.key === key ? ' active' : '');
  });
  if (key === 'Notifications') loadNotificationsTab();
  if (key === 'Activity') loadActivityTab();
  if (key === 'Flagged') loadFlaggedTab();
}

// ── Global filters: date range + organisation ───────────────────────────────
const RANGE_PRESETS = [
  { key: '30d',  label: '30D',  days: 30 },
  { key: '90d',  label: '90D',  days: 90 },
  { key: '6mo',  label: '6M',   days: 182 },
  { key: '12mo', label: '12M',  days: 365 },
  { key: 'all',  label: 'All Time', days: null },
  { key: 'custom', label: 'Custom', days: undefined },
];
let _rangeKey = '6mo';
let _orgFilterId = '';

function renderRangePresets() {
  document.getElementById('rangePresets').innerHTML = RANGE_PRESETS.map(p =>
    `<button class="tab-btn${_rangeKey === p.key ? ' active' : ''}" style="padding:6px 12px" onclick="selectRangePreset('${p.key}')">${p.label}</button>`).join('');
}
function selectRangePreset(key) {
  _rangeKey = key;
  document.getElementById('customRangeBox').style.display = key === 'custom' ? 'flex' : 'none';
  renderRangePresets();
  if (key !== 'custom') renderAll();
}
function onCustomRangeChange() { if (_rangeKey === 'custom') renderAll(); }
function getRange() {
  if (_rangeKey === 'custom') {
    const f = document.getElementById('rangeFrom').value;
    const t = document.getElementById('rangeTo').value;
    return { from: f ? new Date(f + 'T00:00:00') : null, to: t ? new Date(t + 'T23:59:59') : null };
  }
  const preset = RANGE_PRESETS.find(p => p.key === _rangeKey);
  if (!preset || preset.days == null) return { from: null, to: null }; // 'all'
  const to = new Date();
  const from = new Date();
  from.setDate(from.getDate() - preset.days);
  return { from, to };
}
function inRange(dateStr) {
  if (!dateStr) return false;
  const { from, to } = getRange();
  if (!from && !to) return true;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return false;
  if (from && d < from) return false;
  if (to && d > to) return false;
  return true;
}
function renderOrgFilter() {
  const orgs = DC_DATA.getAllOrgs();
  document.getElementById('orgFilterSel').innerHTML = '<option value="">All Organisations</option>' +
    orgs.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join('');
  document.getElementById('orgFilterSel').value = _orgFilterId;
}
function onOrgFilterChange() { _orgFilterId = document.getElementById('orgFilterSel').value; renderAll(); }

// Adaptive trend-chart bucketing — daily for short windows, weekly for
// medium, monthly for long/unbounded ("All Time" defaults to a 12-month
// lookback so the chart stays a readable size). Every trend chart on this
// page calls this instead of the old fixed lastNMonths(6).
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function bucketsForRange() {
  let { from, to } = getRange();
  to = to || new Date();
  from = from || new Date(to.getFullYear(), to.getMonth() - 11, 1);
  const days = Math.max(1, Math.round((to - from) / 86400000));
  const buckets = [];
  if (days <= 31) {
    for (let d = new Date(from.getFullYear(), from.getMonth(), from.getDate()); d <= to; d.setDate(d.getDate() + 1)) {
      const bd = new Date(d);
      buckets.push({ label: bd.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' }), matches: ds => ds && sameDay(new Date(ds), bd) });
    }
  } else if (days <= 180) {
    let d = new Date(from.getFullYear(), from.getMonth(), from.getDate());
    while (d <= to) {
      const start = new Date(d), end = new Date(d); end.setDate(end.getDate() + 6);
      buckets.push({ label: start.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' }), matches: ds => { if (!ds) return false; const x = new Date(ds); return x >= start && x <= end; } });
      d.setDate(d.getDate() + 7);
    }
  } else {
    let d = new Date(from.getFullYear(), from.getMonth(), 1);
    const end = new Date(to.getFullYear(), to.getMonth(), 1);
    while (d <= end) {
      const y = d.getFullYear(), m = d.getMonth();
      buckets.push({ label: d.toLocaleString('en-US', { month: 'short' }), matches: ds => inMonth(ds, y, m) });
      d.setMonth(d.getMonth() + 1);
    }
  }
  return buckets;
}

// ── CSV export ────────────────────────────────────────────────────────────
function exportCSV(rows, headers, filename) {
  const q = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [headers.map(h => q(h.label)).join(',')]
    .concat(rows.map(r => headers.map(h => q(typeof h.get === 'function' ? h.get(r) : r[h.key])).join(',')));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── Helpers ──────────────────────────────────────────────────────────────────
const COLORS = ['#00f0ff','#00d4aa','#ffd93d','#ff6b6b','#d1bcff','#ffb4a2','#00dbe9','#849495'];
function inMonth(dateStr, y, m) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  return d.getFullYear() === y && d.getMonth() === m;
}
function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  return isNaN(dt.getTime()) ? '—' : dt.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' });
}
function titleCase(s) { return (s || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }
function barList(rows, containerId) {
  const max = Math.max(1, ...rows.map(r => r.n));
  document.getElementById(containerId).innerHTML = rows.map((r, i) => `
    <div class="barRow">
      <div class="lbl">${esc(r.label)}</div>
      <div class="track"><div class="fill" style="width:${(r.n / max * 100).toFixed(0)}%;background:${COLORS[i % COLORS.length]}"></div></div>
      <div class="n">${r.n}</div>
    </div>`).join('') || '<div style="color:#849495;font-size:12px;padding:10px 0">No data in this range</div>';
}
function donut(elId, rows, totalLabel) {
  document.getElementById(elId).innerHTML = '';
  if (!rows.length) { document.getElementById(elId).innerHTML = '<div style="color:#849495;font-size:12px;padding:30px 0;text-align:center">No data in this range</div>'; return; }
  new ApexCharts(document.getElementById(elId), {
    chart: { type: 'donut', height: 220, fontFamily: "'Inter',sans-serif", background: 'transparent' },
    series: rows.map(r => r.n),
    labels: rows.map(r => r.label),
    colors: rows.map((r, i) => r.color || COLORS[i % COLORS.length]),
    stroke: { width: 2, colors: ['#0a0a0f'] },
    dataLabels: { enabled: true, style: { fontSize: '10px', fontFamily: "'JetBrains Mono',monospace", colors: ['#0a0a0f'] } },
    legend: { position: 'bottom', fontSize: '11px', fontFamily: "'JetBrains Mono',monospace", labels: { colors: '#b9cacb' }, markers: { width: 8, height: 8 } },
    plotOptions: { pie: { donut: { size: '62%', labels: { show: true, value: { color: '#e7e7ec', fontSize: '19px', fontFamily: "'Hanken Grotesk',sans-serif", fontWeight: 800 }, total: { show: true, label: totalLabel, color: '#849495', fontSize: '9px', fontFamily: "'JetBrains Mono',monospace" } } } } },
    tooltip: { theme: 'dark' },
  }).render();
}
function trendChart(elId, categories, series) {
  document.getElementById(elId).innerHTML = '';
  new ApexCharts(document.getElementById(elId), {
    chart: { height: 220, toolbar: { show: false }, fontFamily: "'Inter',sans-serif", background: 'transparent' },
    series,
    colors: COLORS,
    stroke: { width: 2, curve: 'smooth' },
    fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: .3, opacityTo: 0, stops: [0, 90] } },
    markers: { size: 0, hover: { size: 4 } },
    dataLabels: { enabled: false },
    grid: { borderColor: 'rgba(255,255,255,.05)', strokeDashArray: 3, padding: { left: 4, right: 4 } },
    xaxis: { categories, labels: { style: { colors: '#849495', fontFamily: "'JetBrains Mono',monospace", fontSize: '10px' }, rotate: categories.length > 12 ? -45 : 0 }, axisBorder: { show: false }, axisTicks: { show: false } },
    yaxis: { labels: { style: { colors: '#849495', fontSize: '10px' } } },
    legend: { position: 'top', horizontalAlign: 'right', fontSize: '11px', fontFamily: "'JetBrains Mono',monospace", labels: { colors: '#b9cacb' } },
    tooltip: { theme: 'dark' },
  }).render();
}
function miniStats(rows, containerId, cols) {
  document.getElementById(containerId).innerHTML =
    `<div style="display:grid;grid-template-columns:repeat(${cols || rows.length},1fr);gap:10px;margin-bottom:18px">` +
    rows.map(r => `<div class="glass-lo miniStat"><div class="v" style="color:${r.color || '#e2e2e8'}">${r.v}</div><div class="l">${esc(r.l)}</div></div>`).join('') +
    '</div>';
}

// ── KPI row ────────────────────────────────────────────────────────────────
function renderKPIs() {
  const vehicles = DC_DATA.getVehicles(), rentals = DC_DATA.getRentals();
  const apps = DC_DATA.getRentalApplications(), maint = DC_DATA.getMaintenanceQueries();
  const orgs = DC_DATA.getAllOrgs(), users = DC_DATA.getAllUsers();
  const kpis = [
    { icon: 'garage',       color: '#00f0ff', v: vehicles.length, l: 'Vehicles' },
    { icon: 'receipt_long', color: '#00d4aa', v: rentals.filter(r => r.status === 'active').length, l: 'Active Rentals' },
    { icon: 'assignment',   color: '#ffd93d', v: apps.filter(a => a.status === 'pending').length, l: 'Pending Applications' },
    { icon: 'build',        color: '#ff6b6b', v: maint.filter(m => m.status !== 'resolved').length, l: 'Open Maintenance' },
    { icon: 'domain',       color: '#d1bcff', v: orgs.filter(o => o.status === 'active').length, l: 'Active Orgs' },
    { icon: 'group',        color: '#ffb4a2', v: users.length, l: 'Total Users' },
  ];
  document.getElementById('kpiRow').innerHTML = kpis.map(k => `
    <div class="glass statCard">
      <div style="width:36px;height:36px;border-radius:9px;background:${k.color}18;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <span class="material-symbols-outlined ms" style="font-size:18px;color:${k.color}">${k.icon}</span>
      </div>
      <div><div class="statVal" style="color:${k.color}">${k.v}</div><div class="statLabel">${k.l}</div></div>
    </div>`).join('');
}

// ── Fleet tab ──────────────────────────────────────────────────────────────
function renderFleetTab() {
  let vehicles = DC_DATA.getVehicles();
  if (_orgFilterId) vehicles = vehicles.filter(v => v.orgId === _orgFilterId);
  const byStatus = ['available','on_rent','maintenance','retired'].map(s => ({ label: titleCase(s), n: vehicles.filter(v => v.status === s).length }));
  const typeCounts = {};
  vehicles.forEach(v => { typeCounts[v.type] = (typeCounts[v.type] || 0) + 1; });
  const byType = Object.entries(typeCounts).sort((a,b) => b[1]-a[1]).slice(0,8).map(([t,n]) => ({ label: titleCase(t), n }));
  const dueForService = vehicles.filter(v => (v.nextServiceKm - v.km) <= 2000).length;
  const avgAge = vehicles.length ? Math.round(vehicles.reduce((s,v) => s + (new Date().getFullYear() - (v.year || new Date().getFullYear())), 0) / vehicles.length) : 0;
  const buckets = bucketsForRange();
  const added = buckets.map(b => vehicles.filter(v => b.matches(v.addedAt)).length);

  document.getElementById('panelFleet').innerHTML = `
    <div id="fleetMini"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px" class="grid2">
      <div class="glass" style="border-radius:13px;padding:18px"><div class="panelTitle">Status Breakdown</div><div id="fleetDonut"></div></div>
      <div class="glass" style="border-radius:13px;padding:18px"><div class="panelTitle">By Vehicle Type<button class="btnx" onclick="exportCSV(window._fleetTypeCache||[],[{key:'label',label:'Type'},{key:'n',label:'Count'}],'fleet-by-type.csv')">Export CSV</button></div><div id="fleetTypeBars"></div></div>
    </div>
    <div class="glass" style="border-radius:13px;padding:18px;margin-top:14px"><div class="panelTitle">Vehicles Added</div><div id="fleetTrend"></div></div>`;
  miniStats([
    { v: dueForService, l: 'Due for Service', color: dueForService ? '#ffd93d' : '#00d4aa' },
    { v: avgAge + ' yrs', l: 'Average Fleet Age' },
    { v: vehicles.length, l: 'Total Vehicles' },
  ], 'fleetMini');
  donut('fleetDonut', byStatus.filter(r => r.n > 0), 'Total Fleet');
  barList(byType, 'fleetTypeBars');
  trendChart('fleetTrend', buckets.map(b => b.label), [{ name: 'Vehicles Added', type: 'area', data: added }]);
  window._fleetTypeCache = byType;
}

// ── Rentals tab ────────────────────────────────────────────────────────────
function renderRentalsTab() {
  let rentals = DC_DATA.getRentals();
  if (_orgFilterId) rentals = rentals.filter(r => r.org === _orgFilterId);
  const inRangeRentals = rentals.filter(r => inRange(r.startDate));
  const byStatus = ['pending','active','overdue','complete','cancelled'].map(s => ({ label: titleCase(s), n: inRangeRentals.filter(r => r.status === s).length }));
  const buckets = bucketsForRange();
  const revenue = buckets.map(b => inRangeRentals.filter(r => r.status !== 'cancelled' && b.matches(r.startDate)).reduce((s,r) => s + (r.value||0), 0));
  const durations = inRangeRentals.filter(r => r.startDate && r.returnDate).map(r => (new Date(r.returnDate) - new Date(r.startDate)) / 86400000);
  const avgDuration = durations.length ? Math.round(durations.reduce((a,b)=>a+b,0)/durations.length) : 0;
  const totalRevenue = inRangeRentals.filter(r => r.status !== 'cancelled').reduce((s,r) => s + (r.value||0), 0);
  const equipCounts = {};
  inRangeRentals.forEach(r => { equipCounts[r.equipment] = (equipCounts[r.equipment]||0) + 1; });
  const topEquip = Object.entries(equipCounts).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([e,n]) => ({ label: e, n }));

  // Vehicle utilization: rented-days ÷ owned-days over the selected range.
  const { from: rFrom, to: rTo } = getRange();
  const rangeEnd = rTo || new Date();
  const vehicles = _orgFilterId ? DC_DATA.getVehicles().filter(v => v.orgId === _orgFilterId) : DC_DATA.getVehicles();
  const util = vehicles.map(v => {
    const ownedFrom = rFrom && v.addedAt && new Date(v.addedAt) > rFrom ? new Date(v.addedAt) : (rFrom || (v.addedAt ? new Date(v.addedAt) : rangeEnd));
    const ownedDays = Math.max(1, Math.round((rangeEnd - ownedFrom) / 86400000));
    const rentedDays = rentals.filter(r => r.vehicleId === v.id && r.status !== 'cancelled')
      .reduce((sum, r) => {
        const s = new Date(r.startDate), e = new Date(r.returnDate);
        const clampedStart = s < ownedFrom ? ownedFrom : s;
        const clampedEnd = e > rangeEnd ? rangeEnd : e;
        return sum + Math.max(0, Math.round((clampedEnd - clampedStart) / 86400000));
      }, 0);
    return { label: `${v.make} ${v.model} (${v.regPlate})`, n: Math.min(100, Math.round(rentedDays / ownedDays * 100)) };
  }).sort((a,b) => b.n - a.n);
  const topUtil = util.slice(0, 5);

  const detailRows = inRangeRentals.slice().sort((a,b) => new Date(b.startDate) - new Date(a.startDate)).slice(0, 100);

  document.getElementById('panelRentals').innerHTML = `
    <div id="rentalsMini"></div>
    <div class="glass" style="border-radius:13px;padding:18px;margin-bottom:14px"><div class="panelTitle">Revenue</div><div id="rentalsTrend"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px" class="grid2">
      <div class="glass" style="border-radius:13px;padding:18px"><div class="panelTitle">By Status</div><div id="rentalsDonut"></div></div>
      <div class="glass" style="border-radius:13px;padding:18px"><div class="panelTitle">Most-Rented Equipment</div><div id="rentalsTopBars"></div></div>
    </div>
    <div class="glass" style="border-radius:13px;padding:18px;margin-bottom:14px"><div class="panelTitle">Vehicle Utilization — Top 5 (rented-days ÷ owned-days in range)</div><div id="rentalsUtilBars"></div></div>
    <div class="glass" style="border-radius:13px;overflow:hidden">
      <div style="padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.05)"><div class="panelTitle" style="margin:0">Rentals in Range (${detailRows.length}${inRangeRentals.length>100?' of '+inRangeRentals.length:''})<button class="btnx" onclick="exportRentalsCSV()">Export CSV</button></div></div>
      <div style="overflow-x:auto"><table class="tbl" style="min-width:640px">
        <thead><tr><th>Client</th><th>Org</th><th>Vehicle/Equip.</th><th>Period</th><th>Value</th><th>Status</th></tr></thead>
        <tbody>${detailRows.map(r => `<tr>
          <td>${esc(r.client)}</td><td style="color:#849495">${esc(r.orgName)||'—'}</td><td>${esc(r.equipment)}</td>
          <td style="font-family:'JetBrains Mono',monospace">${fmtDate(r.startDate)} – ${fmtDate(r.returnDate)}</td>
          <td style="font-family:'JetBrains Mono',monospace;color:#00f0ff">R${(r.value||0).toLocaleString()}</td>
          <td>${titleCase(r.status)}</td>
        </tr>`).join('') || `<tr><td colspan="6" style="text-align:center;padding:24px;color:#849495">No rentals in this range</td></tr>`}</tbody>
      </table></div>
    </div>`;
  miniStats([
    { v: 'R' + totalRevenue.toLocaleString('en-ZA'), l: 'Total Revenue', color: '#00f0ff' },
    { v: avgDuration + ' days', l: 'Avg. Rental Duration' },
    { v: inRangeRentals.length, l: 'Rentals in Range' },
  ], 'rentalsMini');
  trendChart('rentalsTrend', buckets.map(b => b.label), [{ name: 'Revenue (R)', type: 'area', data: revenue }]);
  donut('rentalsDonut', byStatus.filter(r => r.n > 0), 'Total Rentals');
  barList(topEquip, 'rentalsTopBars');
  barList(topUtil, 'rentalsUtilBars');
  window._rentalsDetailCache = detailRows;
}

    { key: 'startDate', label: 'Start' }, { key: 'returnDate', label: 'Return' }, { key: 'value', label: 'Value (R)' }, { key: 'status', label: 'Status' },

    document.getElementById('panelActivity').innerHTML = '<div style="padding:30px;text-align:center;color:#849495">Loading activity…</div>';
    try {
      _activityCache = await DC_DATA.getAuditLogs(200);
      _activityLoaded = true;
    } catch (err) {
      document.getElementById('panelActivity').innerHTML = `<div style="padding:30px;text-align:center;color:#ff6b6b">Unable to load activity: ${esc(err.message)}</div>`;
      return;
    }
  }
  renderActivityTab();
}
function renderActivityTab() {
  const logs = _activityCache.filter(l => inRange(l.createdAt));
  const actionCounts = {};
  logs.forEach(l => { actionCounts[l.action] = (actionCounts[l.action]||0)+1; });
  const topActions = Object.entries(actionCounts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([a,n]) => ({ label: titleCase(a), n }));
  const rows = logs.slice(0, 50).map(l => `<tr>
    <td>${esc(l.userName)}<div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#849495">${esc(l.userRole || '')}</div></td>
    <td><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#00f0ff">${esc(l.action)}</span></td>
    <td style="color:#b9cacb">${esc(l.page || '—')}</td>
    <td style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#849495">${l.createdAt ? new Date(l.createdAt).toLocaleString('en-ZA') : '—'}</td>
  </tr>`).join('');
  document.getElementById('panelActivity').innerHTML = `
    <div id="activityMini"></div>
    <div class="glass" style="border-radius:13px;padding:18px;margin-bottom:14px"><div class="panelTitle">Top Actions</div><div id="activityBars"></div></div>
    <div class="glass" style="border-radius:13px;overflow-x:auto">
      <div style="padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;justify-content:flex-end"><button class="btnx" onclick="exportActivityCSV()">Export CSV</button></div>
      <table class="tbl" style="min-width:520px"><thead><tr><th>User</th><th>Action</th><th>Page</th><th>When</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" style="text-align:center;padding:30px;color:#849495">No activity in this range</td></tr>'}</tbody></table>
    </div>`;
  miniStats([{ v: logs.length, l: 'Events in range (most recent ' + _activityCache.length + ' loaded)' }], 'activityMini', 1);
  barList(topActions, 'activityBars');
  window._activityDetailCache = logs.slice(0, 50);
}
function exportActivityCSV() {
  exportCSV(window._activityDetailCache || [], [
    { key: 'userName', label: 'User' }, { key: 'userRole', label: 'Role' }, { key: 'action', label: 'Action' },
    { key: 'page', label: 'Page' }, { key: 'createdAt', label: 'When' },
  ], 'activity.csv');
}

// ── Flagged tab (platform-owner-only — requests/actions that didn't go
//    through, from either the admin or user side) ── lazy-loaded, own fetch
// independent of the Activity tab's 200-cap cache: failures are typically
// sparse relative to routine DATA_MUTATION/PUBLIC_SUBMIT traffic, so
// reusing that cache risks the most recent real failure having already
// scrolled out of a 200-event window. Same audit-log source either way
// (functions/services/auditLog.js), just filtered to a curated list of
// denial/failure action types instead of everything.
const FLAGGED_ACTIONS = new Set([
  'ACCESS_DENIED_NO_TOKEN', 'ACCESS_DENIED_BAD_TOKEN', 'ACCESS_DENIED_ROLE',
  'DATA_ACCESS_DENIED', 'UNAUTHORIZED_ACCESS_ATTEMPT',
  'LOGIN_FAILED', 'LOGIN_FAILED_LOCKED', 'LOGIN_FAILED_UNVERIFIED_EMAIL', 'LOGIN_FAILED_NO_DB_RECORD',
  'BOT_CHECK_FAILED', 'RATE_LIMIT_EXCEEDED',
  'ROLE_CHANGE_FAILED', 'EMAIL_CHANGE_FAILED', 'PASSWORD_CHANGE_FAILED',
  'TOTP_ENROLL_FAILED', 'TOTP_CHALLENGE_FAILED', 'TOTP_SELF_RECOVERY_DENIED_STALE_AUTH',
]);

let _flaggedLoaded = false, _flaggedCache = [];
async function loadFlaggedTab() {
  if (!_flaggedLoaded) {
    document.getElementById('panelFlagged').innerHTML = '<div style="padding:30px;text-align:center;color:#849495">Loading flagged activity…</div>';
    try {
      const all = await DC_DATA.getAuditLogs(500);
      _flaggedCache = all.filter(l => FLAGGED_ACTIONS.has(l.action));
      _flaggedLoaded = true;
    } catch (err) {
      document.getElementById('panelFlagged').innerHTML = `<div style="padding:30px;text-align:center;color:#ff6b6b">Unable to load flagged activity: ${esc(err.message)}</div>`;
      return;
    }
  }
  renderFlaggedTab();
}
function renderFlaggedTab() {
  const logs = _flaggedCache.filter(l => inRange(l.createdAt));
  const actionCounts = {};
  logs.forEach(l => { actionCounts[l.action] = (actionCounts[l.action]||0)+1; });
  const byAction = Object.entries(actionCounts).sort((a,b)=>b[1]-a[1]).map(([a,n]) => ({ label: titleCase(a), n }));
  const rows = logs.slice(0, 100).map(l => `<tr>
    <td>${esc(l.userName)}<div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#849495">${esc(l.userRole || 'anonymous')}</div></td>
    <td><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#ff6b6b">${esc(l.action)}</span></td>
    <td style="color:#b9cacb">${esc(l.page || '—')}</td>
    <td style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#849495;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(l.details)}">${esc(l.details || '—')}</td>
    <td style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#849495">${l.createdAt ? new Date(l.createdAt).toLocaleString('en-ZA') : '—'}</td>
  </tr>`).join('');
  document.getElementById('panelFlagged').innerHTML = `
    <div class="info-box" style="margin-bottom:14px;padding:10px 14px;background:rgba(255,107,107,.06);border:1px solid rgba(255,107,107,.15);border-radius:10px;font-size:12px;color:#ff9d9d;display:flex;align-items:center;gap:8px">
      <span class="material-symbols-outlined ms" style="font-size:16px">flag</span>
      Requests and actions that didn't go through — failed logins, permission denials, rate limiting, bot checks, and 2FA failures, from both the admin and user side.
    </div>
    <div id="flaggedMini"></div>
    <div class="glass" style="border-radius:13px;padding:18px;margin-bottom:14px"><div class="panelTitle">By Type</div><div id="flaggedBars"></div></div>
    <div class="glass" style="border-radius:13px;overflow-x:auto">
      <div style="padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;justify-content:flex-end"><button class="btnx" onclick="exportFlaggedCSV()">Export CSV</button></div>
      <table class="tbl" style="min-width:640px"><thead><tr><th>User</th><th>Action</th><th>Page</th><th>Details</th><th>When</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center;padding:30px;color:#849495">Nothing flagged in this range</td></tr>'}</tbody></table>
    </div>`;
  miniStats([{ v: logs.length, l: 'Flagged events in range (of ' + _flaggedCache.length + ' loaded)' }], 'flaggedMini', 1);
  barList(byAction, 'flaggedBars');
  window._flaggedDetailCache = logs.slice(0, 100);
}
function exportFlaggedCSV() {
  exportCSV(window._flaggedDetailCache || [], [
    { key: 'userName', label: 'User' }, { key: 'userRole', label: 'Role' }, { key: 'action', label: 'Action' },
    { key: 'page', label: 'Page' }, { key: 'details', label: 'Details' }, { key: 'createdAt', label: 'When' },
  ], 'flagged-activity.csv');
}

// ── Custom report builder (new) ─────────────────────────────────────────────
// Genuinely pick-your-own-cut, entirely client-side over data already in
// DC_DATA — no persistence, no new backend. Respects the same global
// date-range + org filters as every other tab.
const CUSTOM_ENTITIES = {
  Rentals: {
    rows: () => { let r = DC_DATA.getRentals().filter(r => inRange(r.startDate)); if (_orgFilterId) r = r.filter(r => r.org === _orgFilterId); return r; },
    dims: {
      status: r => titleCase(r.status),
      org: r => r.orgName || 'Unassigned',
      equipment: r => r.equipment || 'Unknown',
    },
    dimLabels: { status: 'Status', org: 'Organisation', equipment: 'Equipment' },
    metrics: {
      count: rows => rows.length,
      sumValue: rows => rows.reduce((s,r)=>s+(r.value||0),0),
      avgDuration: rows => { const d = rows.filter(r=>r.startDate&&r.returnDate).map(r=>(new Date(r.returnDate)-new Date(r.startDate))/86400000); return d.length ? Math.round(d.reduce((a,b)=>a+b,0)/d.length) : 0; },
    },
    metricLabels: { count: 'Count', sumValue: 'Revenue (R)', avgDuration: 'Avg Duration (days)' },
  },
  Applications: {
    rows: () => { let r = DC_DATA.getRentalApplications().filter(a => inRange(a.submittedAt)); if (_orgFilterId) r = r.filter(a => a.orgId === _orgFilterId); return r; },
    dims: { status: a => titleCase(a.status), org: a => a.orgName || 'Unassigned', creditCheckStatus: a => titleCase(a.creditCheckStatus), equipment: a => a.equipment || 'Unknown' },
    dimLabels: { status: 'Status', org: 'Organisation', creditCheckStatus: 'Credit Check Status', equipment: 'Equipment' },
    metrics: {
      count: rows => rows.length,
      avgScore: rows => { const s = rows.filter(a=>a.creditCheckScore!=null).map(a=>a.creditCheckScore); return s.length ? Math.round(s.reduce((a,b)=>a+b,0)/s.length) : 0; },
    },
    metricLabels: { count: 'Count', avgScore: 'Avg Credit Score' },
  },
  Fleet: {
    rows: () => { let r = DC_DATA.getVehicles(); if (_orgFilterId) r = r.filter(v => v.orgId === _orgFilterId); return r; },
    dims: { status: v => titleCase(v.status), type: v => titleCase(v.type), org: v => v.orgName || 'Unassigned' },
    dimLabels: { status: 'Status', type: 'Type', org: 'Organisation' },
    metrics: {
      count: rows => rows.length,
      avgKm: rows => rows.length ? Math.round(rows.reduce((s,v)=>s+(v.km||0),0)/rows.length) : 0,
    },
    metricLabels: { count: 'Count', avgKm: 'Avg Odometer (km)' },
  },
  Maintenance: {
    rows: () => { const vehOrg = {}; DC_DATA.getVehicles().forEach(v => { vehOrg[v.id]=v.orgId; }); let r = DC_DATA.getMaintenanceQueries().filter(m => inRange(m.createdAt)); if (_orgFilterId) r = r.filter(m => vehOrg[m.vehicleId] === _orgFilterId); return r; },
    dims: { status: m => titleCase(m.status), type: m => titleCase(m.type), priority: m => titleCase(m.priority) },
    dimLabels: { status: 'Status', type: 'Type', priority: 'Priority' },
    metrics: {
      count: rows => rows.length,
      avgResolutionHours: rows => { const r = rows.filter(m=>m.status==='resolved'&&m.resolvedAt&&m.createdAt).map(m=>(new Date(m.resolvedAt)-new Date(m.createdAt))/3600000); return r.length ? Math.round(r.reduce((a,b)=>a+b,0)/r.length) : 0; },
    },
    metricLabels: { count: 'Count', avgResolutionHours: 'Avg Resolution (hrs)' },
  },
};
function onCustEntityChange() {
  const cfg = CUSTOM_ENTITIES[document.getElementById('custEntity').value];
  document.getElementById('custDim').innerHTML = Object.keys(cfg.dims).map(k => `<option value="${k}">${esc(cfg.dimLabels[k])}</option>`).join('');
  document.getElementById('custMetric').innerHTML = Object.keys(cfg.metrics).map(k => `<option value="${k}">${esc(cfg.metricLabels[k])}</option>`).join('');
}
function aggregateCustom(entityKey, dimKey, metricKey) {
  const cfg = CUSTOM_ENTITIES[entityKey];
  const rows = cfg.rows();
  const groups = {};
  rows.forEach(r => { const k = cfg.dims[dimKey](r) || 'Unknown'; (groups[k] = groups[k] || []).push(r); });
  return Object.entries(groups).map(([label, grp]) => ({ label, n: cfg.metrics[metricKey](grp) })).sort((a,b) => b.n - a.n);
}
function renderCustomTab() {
  const entity = document.getElementById('custEntity').value;
  const dim = document.getElementById('custDim').value;
  const metric = document.getElementById('custMetric').value;
  const cfg = CUSTOM_ENTITIES[entity];
  const rows = aggregateCustom(entity, dim, metric);
  document.getElementById('custResult').innerHTML = `
    <div class="glass" style="border-radius:13px;padding:18px">
      <div class="panelTitle">${esc(entity)} — ${esc(cfg.metricLabels[metric])} by ${esc(cfg.dimLabels[dim])}<button class="btnx" onclick="exportCustomCSV()">Export CSV</button></div>
      <div id="custBars"></div>
    </div>`;
  barList(rows, 'custBars');
  window._customCache = rows;
}
function exportCustomCSV() {
  exportCSV(window._customCache || [], [{ key: 'label', label: 'Group' }, { key: 'n', label: 'Value' }], 'custom-report.csv');
}

function renderAll() {
  renderKPIs();
  renderFleetTab();
  renderRentalsTab();
  renderApplicationsTab();
  renderMaintenanceTab();
  renderDriversTab();
  renderOrgsTab();
  renderUsersTab();
  renderCustomTab();
  if (_notifLoaded) renderNotificationsTab();
  if (_activityLoaded) renderActivityTab();
}

DC_DATA.init().then(() => {
  renderRangePresets();
  renderOrgFilter();
  document.getElementById('panelCustom').innerHTML = `
    <div class="glass" style="border-radius:13px;padding:18px;margin-bottom:14px">
      <div class="panelTitle" style="margin-bottom:12px">Build a Report</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px" class="grid3">
        <div><label>Entity</label><select id="custEntity" onchange="onCustEntityChange();renderCustomTab()">${Object.keys(CUSTOM_ENTITIES).map(k => `<option value="${k}">${k}</option>`).join('')}</select></div>
        <div><label>Group By</label><select id="custDim" onchange="renderCustomTab()"></select></div>
        <div><label>Metric</label><select id="custMetric" onchange="renderCustomTab()"></select></div>
      </div>
    </div>
    <div id="custResult"></div>`;
  onCustEntityChange();
  renderAll();
}).catch(err => {
  document.body.insertAdjacentHTML('afterbegin', `<div style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#ff6b6b;color:#000;padding:10px 16px;font-family:monospace;font-size:12px">⚠ Data Connect error: ${EC_SECURITY.sanitizeHtml(err.message)}</div>`);
});
</script>
