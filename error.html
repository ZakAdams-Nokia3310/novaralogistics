<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Something went wrong — EquipCore</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;}
  html,body{height:100%;}
  body{font-family:'Inter',sans-serif;color:#e2e2e8;background:#090b0f;display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh;}
  .ms{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:48px 36px;max-width:420px;width:100%;text-align:center;}
  .icon-ring{width:72px;height:72px;border-radius:50%;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.22);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 0 32px rgba(255,107,107,.12);}
  h1{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:22px;margin-bottom:8px;}
  p{font-size:14px;color:#849495;line-height:1.6;margin-bottom:28px;}
  .btnp{display:inline-flex;align-items:center;gap:7px;padding:12px 22px;background:#00f0ff;color:#003a3c;font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:13px;border-radius:10px;border:none;cursor:pointer;text-decoration:none;transition:filter .18s;}
  .btnp:hover{filter:brightness(1.08);}
  .btng{display:inline-flex;align-items:center;gap:7px;padding:11px 20px;background:rgba(255,255,255,.05);color:#e2e2e8;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;border-radius:10px;border:1px solid rgba(255,255,255,.08);cursor:pointer;text-decoration:none;transition:background .18s;margin-right:8px;}
  .btng:hover{background:rgba(255,255,255,.09);}
  .logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:36px;}
  .ref{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(132,148,149,.4);margin-top:28px;}
  @media(max-width:480px){.card{padding:36px 20px;}.btnp,.btng{width:100%;justify-content:center;margin:0 0 8px 0;}}
</style>
</head>
<body>
<div style="width:100%;max-width:420px">
  <div class="logo">
    <span style="font-size:22px">⚡</span>
    <span style="font-family:'Hanken Grotesk',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,#00f0ff,#7df4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">EquipCore</span>
  </div>
  <div class="card">
    <div class="icon-ring">
      <span class="material-symbols-outlined ms" style="font-size:32px;color:#ff6b6b;font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24">error</span>
    </div>
    <h1>Something went wrong</h1>
    <p>We couldn't load this page. This is usually a temporary issue — please refresh or return to the login screen.</p>
    <div>
      <a href="login.html" class="btnp">
        <span class="material-symbols-outlined ms" style="font-size:16px">login</span>Go to Login
      </a>
    </div>
    <div style="margin-top:12px">
      <a href="javascript:location.reload()" class="btng">
        <span class="material-symbols-outlined ms" style="font-size:15px">refresh</span>Try Again
      </a>
    </div>
    <div class="ref" id="errRef"></div>
  </div>
</div>
<script>
  // Show a non-sensitive reference code so support can correlate reports
  const ts = Date.now().toString(36).toUpperCase();
  document.getElementById('errRef').textContent = 'Ref: ' + ts;
</script>
</body></html>
