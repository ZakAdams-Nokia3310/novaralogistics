<!DOCTYPE html>
<html class="dark" lang="en"><head><script src="canonical-redirect.js"></script>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<title>Maintenance &amp; Queries — EquipCore Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="theme.css" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;}
  body{font-family:'Inter',sans-serif;color:#e2e2e8;min-height:100vh;}
  .ms{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  .glass{background:rgba(255,255,255,.05);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.09);}
  .glass-lo{background:rgba(255,255,255,.03);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.07);}
  .grad{background:linear-gradient(135deg,#00f0ff,#7df4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  #sidebar-root{width:220px;height:100vh;position:fixed;left:0;top:0;z-index:50;display:flex;flex-direction:column;background:rgba(5,7,11,.94);border-right:1px solid rgba(255,255,255,.06);}
  .main{margin-left:220px;min-height:100vh;}
  .topbar{height:56px;position:sticky;top:0;z-index:40;background:rgba(8,10,14,.85);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;padding:0 26px;}
  .body{padding:22px 26px;}
  .tbl{width:100%;border-collapse:collapse;}
  .tbl th{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#849495;padding:10px 14px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02);}
  .tbl td{padding:11px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl tbody tr:hover td{background:rgba(0,240,255,.02);}
  .b{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:10px;}
  .b::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}
  .ba{background:rgba(0,212,170,.1);color:#00d4aa;}
  .bp{background:rgba(255,217,61,.1);color:#ffd93d;}
  .bo{background:rgba(255,107,107,.1);color:#ff6b6b;}
  .bc{background:rgba(209,188,255,.1);color:#d1bcff;}
  .bblue{background:rgba(0,240,255,.1);color:#00f0ff;}
  .btnp{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;background:#00f0ff;color:#003a3c;font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:13px;border-radius:9px;border:none;cursor:pointer;text-decoration:none;transition:filter .18s;}
  .btnp:hover{filter:brightness(1.08);}
  .btng{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;background:rgba(255,255,255,.05);color:#e2e2e8;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;border-radius:9px;border:1px solid rgba(255,255,255,.08);cursor:pointer;text-decoration:none;transition:background .18s;}
  .btng:hover{background:rgba(255,255,255,.09);}
  .btnr{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;background:rgba(255,107,107,.08);color:#ff6b6b;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;border-radius:9px;border:1px solid rgba(255,107,107,.18);cursor:pointer;transition:background .18s;}
  .btnr:hover{background:rgba(255,107,107,.14);}
  input,select,textarea{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:9px;color:#e2e2e8;font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;width:100%;outline:none;transition:border-color .18s;}
  input:focus,select:focus,textarea:focus{border-color:#00f0ff;}
  select option{background:#111317;}
  label{font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:5px;}
  .tab-btn{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:7px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.07);background:none;color:#849495;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .tab-btn.active{background:rgba(0,240,255,.09);color:#00f0ff;border-color:rgba(0,240,255,.2);}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(8,10,14,.85);backdrop-filter:blur(12px);z-index:900;align-items:center;justify-content:center;}
  .modal-bg.show{display:flex;}
  @keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .modal-bg.show .modal-card{animation:slideUp .22s ease both;}
  @media(max-width:768px){#sidebar-root{display:none!important}.main{margin-left:0!important}}
  @media(max-width:600px){
    .body{padding:14px 12px!important}
    .topbar{padding:0 14px!important;height:auto!important;min-height:56px;flex-wrap:wrap;padding-top:10px!important;padding-bottom:10px!important;gap:6px}
    #statsRow{grid-template-columns:repeat(2,1fr)!important}
    #typeTabs{gap:5px}
    .tab-btn{font-size:10px!important;padding:6px 10px!important}
    .tbl th,.tbl td{padding:8px 10px!important;font-size:12px!important}
    .modal-bg{align-items:flex-end!important}
    .modal-bg .modal-card{border-radius:16px 16px 0 0!important;width:100%!important;max-width:100%!important;margin:0!important;max-height:88vh!important;overflow-y:auto!important}
    .btnp,.btng,.btnr{min-height:42px}
  }
</style>
</head>
<body>
<aside id="sidebar-root"></aside>

<div class="main">
  <div class="topbar">
    <div>
      <div style="font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:15px">Maintenance &amp; Queries</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495">Driver issues, roadside assistance, service, windscreen, tyre and general queries</div>
    </div>
    <button class="btnp" onclick="openLogQuery()" style="font-size:12px;padding:7px 13px">
      <span class="material-symbols-outlined ms" style="font-size:15px">add</span>Log Query
    </button>
  </div>

  <div class="body">
    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:18px" id="statsRow"></div>

    <!-- Type filter tabs -->
    <div style="display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap" id="typeTabs"></div>

    <!-- Search + priority filter -->
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <div style="position:relative;flex:1;min-width:200px;max-width:320px">
        <span class="material-symbols-outlined ms" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px;color:#849495;pointer-events:none">search</span>
        <input id="qSearch" placeholder="Search vehicle, description, logged by…" style="padding-left:33px" oninput="renderTable()"/>
      </div>
      <select id="qPriority" onchange="renderTable()" style="width:160px">
        <option value="all">All Priorities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select id="qStatus" onchange="renderTable()" style="width:160px">
        <option value="all">All Statuses</option>
        <option value="open">Open</option>
        <option value="in_progress">In Progress</option>
        <option value="resolved">Resolved</option>
      </select>
    </div>

    <!-- Table -->
    <div class="glass" style="border-radius:13px;overflow:hidden">
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>
            <th>ID</th><th>Vehicle</th><th>Type</th><th>Priority</th>
            <th>Description</th><th>Logged By</th><th>Date</th><th>Status</th><th></th>
          </tr></thead>
          <tbody id="qBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Log Query Modal -->
<div class="modal-bg" id="logQueryModal">
  <div class="modal-card glass" style="border-radius:16px;padding:28px;width:100%;max-width:520px;border-color:rgba(0,240,255,.14);max-height:92vh;overflow-y:auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px">
      <div style="width:36px;height:36px;border-radius:9px;background:rgba(0,240,255,.1);display:flex;align-items:center;justify-content:center">
        <span class="material-symbols-outlined ms" style="font-size:18px;color:#00f0ff">add_task</span>
      </div>
      <div>
        <div style="font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:15px">Log Maintenance Query</div>
        <div style="font-size:12px;color:#849495">Record an issue or service requirement</div>
      </div>
      <button onclick="closeLogQuery()" style="margin-left:auto;background:none;border:none;color:#849495;cursor:pointer;font-size:22px;line-height:1">×</button>
    </div>
    <form id="logQueryForm" style="display:flex;flex-direction:column;gap:14px">
      <div><label>Vehicle</label>
        <select id="mqVehicle" required>
          <option value="">Select vehicle…</option>
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label>Query Type</label>
          <select id="mqType" onchange="onTypeChange()">
            <option value="driver_issue">Driver Issue</option>
            <option value="roadside">Roadside Assistance</option>
            <option value="service">Service / Maintenance</option>
            <option value="windscreen">Windscreen</option>
            <option value="tyres">Tyres</option>
            <option value="general">General Query</option>
          </select>
        </div>
        <div><label>Priority</label>
          <select id="mqPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
      </div>

      <!-- Roadside conditional fields -->
      <div id="roadsideFields" style="display:none;display:none;gap:12px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div><label>Driver Location / Road</label><input id="mqLocation" placeholder="e.g. N1 northbound near Midrand"/></div>
          <div><label>Driver Contact Number</label><input id="mqContact" placeholder="e.g. 082 444 9900" type="tel"/></div>
        </div>
      </div>

      <!-- Service conditional fields -->
      <div id="serviceFields" style="display:none">
        <label>Recommended Service Interval (km) — optional override</label>
        <input id="mqServiceKm" type="number" placeholder="e.g. 10000 — leave blank to keep current"/>
      </div>

      <!-- Windscreen conditional fields -->
      <div id="windscreenFields" style="display:none">
        <label>Damage Type</label>
        <select id="mqWindscreenType">
          <option value="crack">Crack</option>
          <option value="chip">Stone Chip</option>
          <option value="shattered">Shattered / Full Replacement</option>
        </select>
      </div>

      <!-- Tyre conditional fields -->
      <div id="tyreFields" style="display:none">
        <label>Tyres Affected</label>
        <select id="mqTyres">
          <option value="front_left">Front Left</option>
          <option value="front_right">Front Right</option>
          <option value="rear_left">Rear Left</option>
          <option value="rear_right">Rear Right</option>
          <option value="multiple">Multiple Tyres</option>
          <option value="all">All Tyres</option>
        </select>
      </div>

      <div>
        <label>Description</label>
        <textarea id="mqDesc" rows="4" placeholder="Describe the issue in detail…" required style="resize:vertical"></textarea>
      </div>
      <button class="btnp" type="submit" style="width:100%;justify-content:center;padding:11px">
        <span class="material-symbols-outlined ms" style="font-size:16px">add_task</span>Submit Query
      </button>
    </form>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-bg" id="detailModal">
  <div class="modal-card glass" style="border-radius:16px;padding:28px;width:100%;max-width:500px;border-color:rgba(0,240,255,.1)">
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:18px">
      <div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#849495;margin-bottom:4px" id="dId"></div>
        <div style="font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:16px" id="dVehicle"></div>
      </div>
      <button onclick="closeDetail()" style="background:none;border:none;color:#849495;cursor:pointer;font-size:22px;line-height:1">×</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px" id="dBadges"></div>
    <div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px;margin-bottom:14px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;margin-bottom:6px;text-transform:uppercase;letter-spacing:.1em">Description</div>
      <div style="font-size:13px;line-height:1.6;color:#e2e2e8" id="dDesc"></div>
    </div>
    <div id="dExtra" style="margin-bottom:14px"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:#849495">
      <span id="dLogged"></span>
      <span id="dResolved"></span>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px" id="dActions"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="security.js"></script>
<script src="auth.js"></script>
<script src="frontend/token-client.js"></script>
<script src="dc.js?v=2"></script>
<script src="sidebar.js?v=2"></script>
<script src="bg.js"></script>
<script src="transitions.js"></script>
<script>
buildSidebar('admin-maintenance');
const admin = EC_AUTH.require(['admin']);
const esc = EC_SECURITY.sanitizeHtml, escA = EC_SECURITY.escJsAttr;
DC_DATA.setOrgScope(admin.orgId);

let activeType = 'all';

const TYPES = {
  driver_issue: { label:'Driver Issue',       color:'#ffb4a2', icon:'report_problem' },
  roadside:     { label:'Roadside Assist',    color:'#ff6b6b', icon:'emergency' },
  service:      { label:'Service',            color:'#ffd93d', icon:'build' },
  windscreen:   { label:'Windscreen',         color:'#00f0ff', icon:'visibility' },
  tyres:        { label:'Tyres',              color:'#00d4aa', icon:'tire_repair' },
  general:      { label:'General Query',      color:'#d1bcff', icon:'help' },
};

const PRIO = {
  critical: { label:'Critical', color:'#ff6b6b' },
  high:     { label:'High',     color:'#ffb4a2' },
  medium:   { label:'Medium',   color:'#ffd93d' },
  low:      { label:'Low',      color:'#849495' },
};

function typeBadge(t) {
  const cfg = TYPES[t] || { label: t, color: '#849495' };
  return `<span style="font-family:'JetBrains Mono',monospace;font-size:10px;background:${cfg.color}18;color:${cfg.color};padding:3px 8px;border-radius:999px;border:1px solid ${cfg.color}28">${cfg.label}</span>`;
}

function prioBadge(p) {
  const cfg = PRIO[p] || { label: p, color: '#849495' };
  return `<span style="font-family:'JetBrains Mono',monospace;font-size:10px;background:${cfg.color}18;color:${cfg.color};padding:3px 8px;border-radius:999px;border:1px solid ${cfg.color}28">${cfg.label}</span>`;
}

function statusBadge(s) {
  if (s === 'open')        return `<span class="b bo">Open</span>`;
  if (s === 'in_progress') return `<span class="b bp">In Progress</span>`;
  if (s === 'resolved')    return `<span class="b ba">Resolved</span>`;
  return `<span class="b">${s}</span>`;
}

function renderStats() {
  const qs = DC_DATA.getMaintenanceQueries();
  [
    { icon:'pending_actions', bg:'rgba(255,107,107,.1)',  color:'#ff6b6b', val:qs.filter(q=>q.status==='open').length,        label:'Open' },
    { icon:'priority_high',   bg:'rgba(255,107,107,.14)', color:'#ff6b6b', val:qs.filter(q=>q.priority==='critical').length,  label:'Critical' },
    { icon:'autorenew',       bg:'rgba(255,217,61,.1)',   color:'#ffd93d', val:qs.filter(q=>q.status==='in_progress').length, label:'In Progress' },
    { icon:'check_circle',    bg:'rgba(0,212,170,.1)',    color:'#00d4aa', val:qs.filter(q=>q.status==='resolved').length,    label:'Resolved' },
  ].forEach((c, i) => {
    document.getElementById('statsRow').children[i] && null;
  });
  document.getElementById('statsRow').innerHTML = [
    { icon:'pending_actions', bg:'rgba(255,107,107,.1)',  color:'#ff6b6b', val:qs.filter(q=>q.status==='open').length,        label:'Open' },
    { icon:'priority_high',   bg:'rgba(255,107,107,.14)', color:'#ff6b6b', val:qs.filter(q=>q.priority==='critical').length,  label:'Critical' },
    { icon:'autorenew',       bg:'rgba(255,217,61,.1)',   color:'#ffd93d', val:qs.filter(q=>q.status==='in_progress').length, label:'In Progress' },
    { icon:'check_circle',    bg:'rgba(0,212,170,.1)',    color:'#00d4aa', val:qs.filter(q=>q.status==='resolved').length,    label:'Resolved' },
  ].map(c => `<div class="glass-lo" style="border-radius:12px;padding:16px;display:flex;align-items:center;gap:10px">
    <div style="width:34px;height:34px;border-radius:9px;background:${c.bg};display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <span class="material-symbols-outlined ms" style="font-size:17px;color:${c.color}">${c.icon}</span>
    </div>
    <div>
      <div style="font-family:'Hanken Grotesk',sans-serif;font-size:22px;font-weight:800;color:${c.color}">${c.val}</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.08em">${c.label}</div>
    </div>
  </div>`).join('');
}

function renderTabs() {
  const qs = DC_DATA.getMaintenanceQueries();
  const counts = {};
  Object.keys(TYPES).forEach(t => counts[t] = qs.filter(q => q.type === t).length);
  const tabs = [
    { key:'all', label:'All', count: qs.length, icon:'list' },
    ...Object.entries(TYPES).map(([key, cfg]) => ({ key, label: cfg.label, count: counts[key], icon: cfg.icon }))
  ];
  document.getElementById('typeTabs').innerHTML = tabs.map(t => `
    <button class="tab-btn${activeType === t.key ? ' active' : ''}" onclick="setType('${t.key}')">
      <span class="material-symbols-outlined ms" style="font-size:14px">${t.icon}</span>
      ${t.label}
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(255,255,255,.08);padding:1px 6px;border-radius:999px">${t.count}</span>
    </button>
  `).join('');
}

function setType(type) {
  activeType = type;
  renderTabs();
  renderTable();
}

function renderTable() {
  const q     = (document.getElementById('qSearch').value || '').toLowerCase();
  const pf    = document.getElementById('qPriority').value;
  const sf    = document.getElementById('qStatus').value;
  const qs    = DC_DATA.getMaintenanceQueries().filter(item => {
    if (activeType !== 'all' && item.type !== activeType) return false;
    if (pf !== 'all' && item.priority !== pf) return false;
    if (sf !== 'all' && item.status !== sf) return false;
    if (q && !`${item.vehicleLabel} ${item.description} ${item.loggedBy} ${item.id}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const tbody = document.getElementById('qBody');
  if (!qs.length) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:#849495;font-family:'JetBrains Mono',monospace;font-size:12px">No queries match your filters</td></tr>`;
    return;
  }
  tbody.innerHTML = qs.map(item => {
    const ts = new Date(item.loggedAt);
    const dateLabel = ts.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    const shortDesc = item.description.length > 80 ? item.description.slice(0, 78) + '…' : item.description;
    const pCfg = PRIO[item.priority] || { color:'#849495' };
    const rowBg = item.priority === 'critical' ? 'background:rgba(255,107,107,.025)' : '';
    return `<tr style="${rowBg}">
      <td data-label="Vehicle">
        <div style="font-weight:600;font-size:12px">${esc(item.vehicleLabel.split('·')[0].trim())}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495">${esc(item.vehicleLabel.split('·')[1]?.trim() || '')}</div>
      </td>
      <td data-label="Type">${typeBadge(item.type)}</td>
      <td data-label="Priority"><span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${pCfg.color};font-weight:600;text-transform:uppercase">${esc(item.priority)}</span></td>
      <td data-label="Description" style="color:#b9cacb;font-size:12px">${esc(shortDesc)}</td>
      <td data-label="Logged By" style="font-size:12px;color:#849495">${esc(item.loggedBy)}</td>
      <td data-label="Date" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495">${dateLabel}</td>
      <td data-label="Status">${statusBadge(item.status)}</td>
      <td>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btng" style="font-size:12px;padding:8px 12px" onclick="openDetail('${escA(item.id)}')">Details</button>
          ${item.status !== 'resolved' ? `
            ${item.status === 'open' ? `<button class="btng" style="font-size:12px;padding:8px 12px;color:#ffd93d;border-color:rgba(255,217,61,.2)" onclick="updateStatus('${escA(item.id)}','in_progress')">In Progress</button>` : ''}
            <button class="btng" style="font-size:12px;padding:8px 12px;color:#00d4aa;border-color:rgba(0,212,170,.2)" onclick="updateStatus('${escA(item.id)}','resolved')">Resolve</button>
          ` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function updateStatus(id, status) {
  await DC_DATA.updateQueryStatus(id, status);
  renderAll();
}

// Log Query Modal
function populateVehicleSelect() {
  const sel = document.getElementById('mqVehicle');
  sel.innerHTML = '<option value="">Select vehicle…</option>';
  DC_DATA.getVehicles().forEach(v => {
    sel.innerHTML += `<option value="${esc(v.id)}" data-label="${esc(v.make)} ${esc(v.model)} · ${esc(v.regPlate)}">${esc(v.make)} ${esc(v.model)} (${esc(v.regPlate)})</option>`;
  });
}

function onTypeChange() {
  const type = document.getElementById('mqType').value;
  document.getElementById('roadsideFields').style.display  = type === 'roadside'   ? 'block' : 'none';
  document.getElementById('serviceFields').style.display   = type === 'service'    ? 'block' : 'none';
  document.getElementById('windscreenFields').style.display= type === 'windscreen' ? 'block' : 'none';
  document.getElementById('tyreFields').style.display      = type === 'tyres'      ? 'block' : 'none';
  const placeholders = {
    driver_issue: 'Describe what the driver reported — warning lights, sounds, handling issues…',
    roadside:     'Describe the breakdown — engine failure, accident, tyre blow-out… Include road name and direction.',
    service:      'Describe service required — oil change, brake inspection, full 10,000km service…',
    windscreen:   'Describe damage — size of crack, location on screen, visibility impact…',
    tyres:        'Describe tyre condition — tread depth, sidewall damage, pressure issues…',
    general:      'Describe the query or issue in detail…',
  };
  document.getElementById('mqDesc').placeholder = placeholders[type] || 'Describe the issue…';
}

function openLogQuery() {
  document.getElementById('logQueryForm').reset();
  populateVehicleSelect();
  onTypeChange();
  document.getElementById('logQueryModal').classList.add('show');
}
function closeLogQuery() { document.getElementById('logQueryModal').classList.remove('show'); }

document.getElementById('logQueryForm').addEventListener('submit', async e => {
  e.preventDefault();
  const vehSel = document.getElementById('mqVehicle');
  const vehId  = vehSel.value;
  const vehOpt = vehSel.options[vehSel.selectedIndex];
  const vehLabel = vehOpt?.dataset.label || vehOpt?.text || '';
  const type     = document.getElementById('mqType').value;
  const priority = document.getElementById('mqPriority').value;
  const desc     = document.getElementById('mqDesc').value.trim();
  if (!vehId) return;

  const data = {
    vehicleId: vehId,
    vehicleLabel: vehLabel,
    type, priority, description: desc,
    loggedBy: admin ? admin.name : 'Admin',
  };

  if (type === 'roadside') {
    data.location      = document.getElementById('mqLocation').value.trim();
    data.contactNumber = document.getElementById('mqContact').value.trim();
  }
  if (type === 'service') {
    const km = document.getElementById('mqServiceKm').value;
    if (km) data.recommendedIntervalKm = +km;
  }
  if (type === 'windscreen') {
    data.damageType = document.getElementById('mqWindscreenType').value;
  }
  if (type === 'tyres') {
    data.tyresAffected = document.getElementById('mqTyres').value;
  }

  await DC_DATA.addMaintenanceQuery(data);
  closeLogQuery();
  renderAll();
});

// Detail Modal
function openDetail(id) {
  const item = DC_DATA.getMaintenanceQueries().find(q => q.id === id);
  if (!item) return;
  document.getElementById('dId').textContent      = item.id;
  document.getElementById('dVehicle').textContent = item.vehicleLabel;
  document.getElementById('dDesc').textContent    = item.description;
  document.getElementById('dBadges').innerHTML    = typeBadge(item.type) + ' ' + prioBadge(item.priority) + ' ' + statusBadge(item.status);
  const ts       = new Date(item.loggedAt);
  const dateStr  = ts.toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  document.getElementById('dLogged').textContent   = `Logged by ${item.loggedBy} · ${dateStr}`;
  document.getElementById('dResolved').textContent = item.resolvedAt ? `Resolved: ${new Date(item.resolvedAt).toLocaleDateString('en-GB')}` : '';

  let extra = '';
  if (item.location)          extra += extraRow('Location', item.location);
  if (item.contactNumber)     extra += extraRow('Driver Contact', item.contactNumber);
  if (item.damageType)        extra += extraRow('Damage Type', item.damageType.replace(/_/g,' '));
  if (item.tyresAffected)     extra += extraRow('Tyres Affected', item.tyresAffected.replace(/_/g,' '));
  if (item.recommendedIntervalKm) extra += extraRow('Recommended Interval', item.recommendedIntervalKm.toLocaleString() + ' km');
  document.getElementById('dExtra').innerHTML = extra;

  const actions = document.getElementById('dActions');
  actions.innerHTML = '';
  if (item.status !== 'resolved') {
    if (item.status === 'open') {
      const b1 = document.createElement('button');
      b1.className = 'btng';
      b1.style.cssText = 'flex:1;justify-content:center;font-size:12px;color:#ffd93d;border-color:rgba(255,217,61,.2)';
      b1.textContent = 'Mark In Progress';
      b1.onclick = () => { updateStatus(id,'in_progress'); closeDetail(); };
      actions.appendChild(b1);
    }
    const b2 = document.createElement('button');
    b2.className = 'btnp';
    b2.style.cssText = 'flex:1;justify-content:center;font-size:12px';
    b2.textContent = 'Mark Resolved';
    b2.onclick = () => { updateStatus(id,'resolved'); closeDetail(); };
    actions.appendChild(b2);
  }

  document.getElementById('detailModal').classList.add('show');
}

function extraRow(label, val) {
  return `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)">
    <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.08em">${esc(label)}</span>
    <span style="font-size:12px;font-weight:600">${esc(val)}</span>
  </div>`;
}

function closeDetail() { document.getElementById('detailModal').classList.remove('show'); }

function renderAll() { renderStats(); renderTabs(); renderTable(); }
DC_DATA.init().then(renderAll).catch(err => {
  document.body.insertAdjacentHTML('afterbegin', `<div style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#ff6b6b;color:#000;padding:10px 16px;font-family:monospace;font-size:12px">⚠ Data Connect error: ${EC_SECURITY.sanitizeHtml(err.message)}</div>`);
});
</script>
</body></html>
