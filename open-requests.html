<!DOCTYPE html>
<html class="dark" lang="en"><head><script src="canonical-redirect.js"></script>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<title>Open Requests — EquipCore</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="theme.css" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;}
  body{font-family:'Inter',sans-serif;color:#e2e2e8;min-height:100vh;}
  .ms{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  .glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.09);}
  .sidebar{width:220px;height:100vh;position:fixed;left:0;top:0;z-index:50;display:flex;flex-direction:column;background:rgba(5,7,11,0.94);border-right:1px solid rgba(255,255,255,0.06);}
  .main{margin-left:220px;min-height:100vh;}
  .topbar{height:56px;position:sticky;top:0;z-index:40;background:rgba(8,10,14,0.82);border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;padding:0 26px;}
  .body{padding:22px 26px;}
  .btnp{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;background:#00f0ff;color:#003a3c;font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:13px;border-radius:9px;border:none;cursor:pointer;text-decoration:none;transition:all .18s;}
  .btnp:hover{filter:brightness(1.08);}
  .btnp:disabled{opacity:.5;cursor:default;}
  .btng{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;background:rgba(255,255,255,.05);color:#e2e2e8;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;border-radius:9px;border:1px solid rgba(255,255,255,.08);cursor:pointer;text-decoration:none;transition:all .18s;}
  .btng:hover{background:rgba(255,255,255,.08);}
  .tab-btn{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:8px 16px;border-radius:9px;border:1px solid rgba(255,255,255,.07);background:none;color:#849495;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:7px;}
  .tab-btn.active{background:rgba(0,240,255,.09);color:#00f0ff;border-color:rgba(0,240,255,.2);}
  .card{border-radius:14px;padding:16px 18px;margin-bottom:12px;}
  .b{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;}
  .ba{background:rgba(0,212,170,.1);color:#00d4aa;}
  .bp{background:rgba(255,217,61,.1);color:#ffd93d;}
  .bo{background:rgba(255,107,107,.1);color:#ff6b6b;}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(8,10,14,.85);backdrop-filter:blur(12px);z-index:900;align-items:center;justify-content:center;}
  .modal-bg.show{display:flex;}
  @keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .modal-bg.show .modal-card{animation:slideUp .22s ease both;}
  label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px;}
  input[type=number],textarea{width:100%;padding:10px 13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:9px;color:#e2e2e8;font-family:'Inter',sans-serif;font-size:14px;outline:none;}
  input:focus,textarea:focus{border-color:#00f0ff;box-shadow:0 0 0 1px rgba(0,240,255,.2);}
  textarea{resize:vertical;min-height:70px;}
  .fg{margin-bottom:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .err{display:none;padding:10px 14px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.2);border-radius:9px;font-size:12px;color:#ff6b6b;font-family:'JetBrains Mono',monospace;margin-bottom:14px;}
  @media(max-width:768px){.sidebar{display:none!important}.main{margin-left:0!important}}
  @media(max-width:600px){.body{padding:14px 12px!important}.grid3{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<div id="sidebar-root" class="sidebar"></div>

<div class="main">
  <div class="topbar">
    <div>
      <div style="font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:15px">Open Requests</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495">Equipment other organisations need — quote as your own org</div>
    </div>
    <a href="marketplace" class="btng"><span class="material-symbols-outlined ms" style="font-size:15px">storefront</span>Marketplace</a>
  </div>

  <div class="body">
    <div style="display:flex;gap:8px;margin-bottom:18px">
      <button class="tab-btn active" id="tabOpenBtn" onclick="switchTab('open')"><span class="material-symbols-outlined ms" style="font-size:14px">campaign</span>Open Requests</button>
      <button class="tab-btn" id="tabMineBtn" onclick="switchTab('mine')"><span class="material-symbols-outlined ms" style="font-size:14px">request_quote</span>My Quotes</button>
    </div>

    <div id="tabOpen">
      <div id="openList"></div>
    </div>
    <div id="tabMine" style="display:none">
      <div id="mineList"></div>
    </div>
  </div>
</div>

<!-- Quote modal -->
<div class="modal-bg" id="quoteModal">
  <div class="modal-card glass" style="border-radius:16px;padding:28px;width:100%;max-width:440px;border-color:rgba(0,240,255,.14)">
    <div style="font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:16px;margin-bottom:4px">Submit a Quote</div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;margin-bottom:18px" id="quoteModalSub"></div>
    <div class="err" id="quoteErr"></div>
    <form id="quoteForm">
      <div class="grid3">
        <div class="fg"><label>Daily (R)</label><input type="number" id="qDaily" min="0" step="0.01"/></div>
        <div class="fg"><label>Weekly (R)</label><input type="number" id="qWeekly" min="0" step="0.01"/></div>
        <div class="fg"><label>Monthly (R)</label><input type="number" id="qMonthly" min="0" step="0.01"/></div>
      </div>
      <div class="fg"><label>Message</label><textarea id="qMessage" placeholder="Availability, terms, anything the requester should know…"></textarea></div>
      <div style="display:flex;gap:10px;margin-top:6px">
        <button type="submit" class="btnp" id="qSubmitBtn" style="flex:1;justify-content:center;padding:11px">Send Quote</button>
        <button type="button" class="btng" onclick="closeQuoteModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- Quotes-for-request modal (viewed from My Quotes / not editable here) -->

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="security.js"></script>
<script src="auth.js"></script>
<script src="frontend/token-client.js"></script>
<script src="dc.js"></script>
<script src="sidebar.js"></script>
<script src="bg.js"></script>
<script src="transitions.js"></script>
<script>
buildSidebar('open-requests');
const esc = EC_SECURITY.sanitizeHtml;
const user = EC_AUTH.require(['admin', 'user', 'driver']);

function titleCase(snake) {
  return (snake || '').toLowerCase().split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function statusBadge(s) {
  if (s === 'open')     return `<span class="b bp">Open</span>`;
  if (s === 'awarded')  return `<span class="b ba">Awarded</span>`;
  if (s === 'closed')   return `<span class="b bo">Closed</span>`;
  if (s === 'pending')  return `<span class="b bp">Pending</span>`;
  if (s === 'accepted') return `<span class="b ba">Accepted</span>`;
  if (s === 'declined') return `<span class="b bo">Declined</span>`;
  return '';
}

let _openRequests = [];
let _myQuotes = [];
let _activeRequestId = null;

function switchTab(which) {
  document.getElementById('tabOpen').style.display = which === 'open' ? '' : 'none';
  document.getElementById('tabMine').style.display  = which === 'mine' ? '' : 'none';
  document.getElementById('tabOpenBtn').classList.toggle('active', which === 'open');
  document.getElementById('tabMineBtn').classList.toggle('active', which === 'mine');
}

function renderOpen() {
  const el = document.getElementById('openList');
  if (!_openRequests.length) {
    el.innerHTML = `<div class="glass card" style="text-align:center;padding:36px;color:#849495;font-family:'JetBrains Mono',monospace;font-size:12px">No open requests right now</div>`;
    return;
  }
  el.innerHTML = _openRequests.map(r => `
    <div class="glass card" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="min-width:0">
        <div style="font-weight:700;font-size:14px;margin-bottom:4px">${esc(titleCase(r.vehicleType))}${r.province ? ' · ' + esc(titleCase(r.province)) : ''}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#849495;margin-bottom:6px">
          ${r.hireMode ? esc(titleCase(r.hireMode)) + ' · ' : ''}${r.neededFrom ? 'From ' + esc(r.neededFrom) : ''}${r.neededTo ? ' to ' + esc(r.neededTo) : ''}
        </div>
        ${r.description ? `<div style="font-size:13px;color:#b9cacb">${esc(r.description)}</div>` : ''}
      </div>
      <button class="btnp" onclick="openQuoteModal('${r.id}')"><span class="material-symbols-outlined ms" style="font-size:15px">request_quote</span>Submit Quote</button>
    </div>
  `).join('');
}

function renderMine() {
  const el = document.getElementById('mineList');
  if (!_myQuotes.length) {
    el.innerHTML = `<div class="glass card" style="text-align:center;padding:36px;color:#849495;font-family:'JetBrains Mono',monospace;font-size:12px">You haven't submitted any quotes yet</div>`;
    return;
  }
  el.innerHTML = _myQuotes.map(q => `
    <div class="glass card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px">
        <div style="font-weight:700;font-size:14px">${esc(titleCase(q.requestVehicleType))}${q.requestProvince ? ' · ' + esc(titleCase(q.requestProvince)) : ''}</div>
        ${statusBadge(q.status)}
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#849495">
        ${q.dailyRate ? 'R' + q.dailyRate.toLocaleString('en-ZA') + '/day  ' : ''}${q.weeklyRate ? 'R' + q.weeklyRate.toLocaleString('en-ZA') + '/week  ' : ''}${q.monthlyRate ? 'R' + q.monthlyRate.toLocaleString('en-ZA') + '/month' : ''}
      </div>
      ${q.message ? `<div style="font-size:13px;color:#b9cacb;margin-top:6px">${esc(q.message)}</div>` : ''}
      ${q.requestStatus === 'awarded' && q.status === 'accepted' ? `<div style="margin-top:8px;font-size:12px;color:#00d4aa">You won this request — coordinate with the requester.</div>` : ''}
    </div>
  `).join('');
}

function openQuoteModal(requestId) {
  _activeRequestId = requestId;
  const r = _openRequests.find(x => x.id === requestId);
  document.getElementById('quoteModalSub').textContent = r ? (titleCase(r.vehicleType) + (r.province ? ' · ' + titleCase(r.province) : '')) : '';
  document.getElementById('quoteForm').reset();
  document.getElementById('quoteErr').style.display = 'none';
  document.getElementById('quoteModal').classList.add('show');
}
function closeQuoteModal() {
  document.getElementById('quoteModal').classList.remove('show');
  _activeRequestId = null;
}

document.getElementById('quoteForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('quoteErr');
  const btn = document.getElementById('qSubmitBtn');
  err.style.display = 'none';

  if (!user.orgId) {
    err.textContent = 'Your account isn\'t linked to an organisation, so you can\'t submit a quote on its behalf. Contact an admin.';
    err.style.display = 'block';
    return;
  }
  const daily = document.getElementById('qDaily').value;
  const weekly = document.getElementById('qWeekly').value;
  const monthly = document.getElementById('qMonthly').value;
  if (!daily && !weekly && !monthly) {
    err.textContent = 'Please enter at least one rate.';
    err.style.display = 'block';
    return;
  }

  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await DC_DATA.submitQuote({
      requestId: _activeRequestId,
      supplierOrganisationId: user.orgId,
      dailyRate: daily, weeklyRate: weekly, monthlyRate: monthly,
      message: document.getElementById('qMessage').value.trim(),
    });
    closeQuoteModal();
    window.showToast?.('success', 'Quote sent.');
    await loadAll();
  } catch (ex) {
    err.textContent = ex.message || 'Unable to send quote. Please try again.';
    err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Send Quote';
  }
});

async function loadAll() {
  _openRequests = await DC_DATA.getOpenEquipmentRequests();
  _myQuotes = user.orgId ? await DC_DATA.getMyQuotes(user.orgId) : [];
  renderOpen();
  renderMine();
}

DC_DATA.init().then(loadAll);
</script>
<script src="cookie-consent.js"></script>
</body></html>
