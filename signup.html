<!DOCTYPE html>
<html class="dark" lang="en"><head><script src="canonical-redirect.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Create Account — EquipCore</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:#e2e2e8;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
  .glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);}
  input{width:100%;padding:13px 14px 13px 44px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:12px;color:#e2e2e8;font-family:'Inter',sans-serif;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s;}
  input:focus{border-color:#00f0ff;box-shadow:0 0 0 1px rgba(0,240,255,0.3);}
  input::placeholder{color:rgba(255,255,255,0.22);}
  .btn-main{width:100%;padding:14px;background:#00f0ff;color:#003a3c;font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:15px;border:none;border-radius:12px;cursor:pointer;transition:all .2s;box-shadow:0 0 30px rgba(0,240,255,0.18);}
  .btn-main:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 36px rgba(0,240,255,0.28);}
  .btn-main:disabled{opacity:.6;cursor:default;transform:none;}
  .grad{background:linear-gradient(135deg,#00f0ff,#7df4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .anim{animation:up .5s cubic-bezier(0.4,0,0.2,1) both;}
  .d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}.d4{animation-delay:.3s}
  .pwd-strength{height:3px;border-radius:2px;margin-top:6px;transition:all .3s}
</style>
</head>
<body>

<div style="position:relative;z-index:2;width:100%;max-width:420px;padding:24px">

  <!-- Logo -->
  <div class="anim" style="text-align:center;margin-bottom:36px">
    <a href="/" style="text-decoration:none;display:inline-flex;align-items:center;gap:10px">
      <span style="font-size:26px">⚡</span>
      <span class="grad" style="font-family:'Hanken Grotesk',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.03em">EquipCore</span>
    </a>
    <p style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(0,240,255,0.5);letter-spacing:.22em;text-transform:uppercase;margin-top:6px">Fleet &amp; Equipment Manager</p>
  </div>

  <!-- Card -->
  <div class="glass anim d1" style="border-radius:20px;padding:36px 32px">

    <h2 class="d2 anim" style="font-family:'Hanken Grotesk',sans-serif;font-size:22px;font-weight:800;margin-bottom:5px">Create your account</h2>
    <p class="d2 anim" style="color:#b9cacb;font-size:13px;margin-bottom:28px">Sign up to browse fleet, apply for rentals, and manage operations.</p>

    <form id="signupForm" novalidate>
      <input type="text" name="username" id="hp_signup" data-honeypot tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none"/>

      <!-- Name -->
      <div style="margin-bottom:14px">
        <label style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:7px">Full Name</label>
        <div style="position:relative">
          <span class="material-symbols-outlined" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:18px;color:#849495;pointer-events:none">person</span>
          <input id="nameInput" type="text" placeholder="Your full name" autocomplete="name" required/>
        </div>
      </div>

      <!-- Email -->
      <div style="margin-bottom:14px">
        <label style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:7px">Email Address</label>
        <div style="position:relative">
          <span class="material-symbols-outlined" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:18px;color:#849495;pointer-events:none">alternate_email</span>
          <input id="emailInput" type="email" placeholder="you@company.com" autocomplete="email" required/>
        </div>
      </div>

      <!-- Password -->
      <div style="margin-bottom:14px">
        <label style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:7px">Password</label>
        <div style="position:relative">
          <span class="material-symbols-outlined" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:18px;color:#849495;pointer-events:none">lock</span>
          <input id="pwdInput" type="password" placeholder="Min. 6 characters" autocomplete="new-password" style="padding-right:46px" required/>
          <button type="button" id="togglePwd" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#849495;display:flex;align-items:center;padding:4px">
            <span class="material-symbols-outlined" style="font-size:18px">visibility</span>
          </button>
        </div>
        <div id="pwdStrength" class="pwd-strength" style="width:0%;background:#333"></div>
      </div>

      <!-- Confirm Password -->
      <div style="margin-bottom:22px">
        <label style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#849495;text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:7px">Confirm Password</label>
        <div style="position:relative">
          <span class="material-symbols-outlined" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:18px;color:#849495;pointer-events:none">lock</span>
          <input id="pwd2Input" type="password" placeholder="Repeat password" autocomplete="new-password" required/>
        </div>
      </div>

      <!-- Error -->
      <div id="errBox" style="display:none;margin-bottom:14px;padding:10px 14px;background:rgba(255,100,100,0.08);border:1px solid rgba(255,100,100,0.2);border-radius:10px;font-size:13px;color:#ff6b6b;font-family:'JetBrains Mono',monospace"></div>

      <button class="btn-main d3 anim" id="submitBtn" type="submit">Create Account</button>
    </form>

    <div style="margin-top:20px;text-align:center;font-size:13px;color:#849495">
      Already have an account? <a href="login" style="color:#00dbe9;text-decoration:none">Sign in →</a>
    </div>
  </div>

  <!-- Status -->
  <div class="anim d4" style="margin-top:20px;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px">
    <span style="width:6px;height:6px;border-radius:50%;background:#00d4aa;box-shadow:0 0 8px #00d4aa;display:inline-block"></span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.22);letter-spacing:.12em">ALL SYSTEMS OPERATIONAL</span>
  </div>
</div>

<script src="security.js"></script>
<script src="auth.js"></script>
<script src="frontend/token-client.js"></script>
<script src="bg.js"></script>
<script src="transitions.js"></script>
<script>
// Redirect if already logged in
var _u = EC_AUTH.current();
if (_u) location.href = EC_AUTH.dashFor(_u.role);

var form    = document.getElementById('signupForm');
var btn     = document.getElementById('submitBtn');
var errBox  = document.getElementById('errBox');
var pwdBar  = document.getElementById('pwdStrength');

// Password strength indicator
document.getElementById('pwdInput').addEventListener('input', function(){
  var v = this.value, score = 0;
  if (v.length >= 6)  score++;
  if (v.length >= 10) score++;
  if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  var pct  = Math.min(score / 5 * 100, 100);
  var col  = score <= 1 ? '#ff4444' : score <= 2 ? '#ff9900' : score <= 3 ? '#ffcc00' : '#00d4aa';
  pwdBar.style.width = pct + '%';
  pwdBar.style.background = col;
});

// Toggle password visibility
document.getElementById('togglePwd').addEventListener('click', function(){
  var inp  = document.getElementById('pwdInput');
  var icon = this.querySelector('.material-symbols-outlined');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  icon.textContent = inp.type === 'password' ? 'visibility' : 'visibility_off';
});

form.addEventListener('submit', function(e){
  e.preventDefault();

  if (typeof EC_SECURITY !== 'undefined' && EC_SECURITY.isHoneypotTripped(form)) return;
  if (typeof EC_SECURITY !== 'undefined' && !EC_SECURITY.checkRateLimit('signup_submit')) {
    showErr('Too many requests. Please slow down.'); return;
  }

  var name  = document.getElementById('nameInput').value.trim();
  var email = document.getElementById('emailInput').value.trim();
  var pwd   = document.getElementById('pwdInput').value;
  var pwd2  = document.getElementById('pwd2Input').value;

  if (!name || !email || !pwd) { showErr('All fields are required.'); return; }
  if (pwd !== pwd2) { showErr('Passwords do not match.'); return; }

  btn.textContent = 'Creating account…'; btn.disabled = true;

  setTimeout(function(){
    try {
      var user = EC_AUTH.signup(name, email, pwd);
      location.href = EC_AUTH.dashFor(user.role) + '?intro=1';
    } catch (err) {
      showErr(err.message || 'Sign-up failed.');
    }
  }, 500);
});

function showErr(msg) {
  errBox.textContent = msg; errBox.style.display = 'block';
  form.style.animation = 'shake .4s ease';
  setTimeout(function(){ form.style.animation = ''; }, 400);
  btn.textContent = 'Create Account'; btn.disabled = false;
}
</script>
<script src="cookie-consent.js"></script>
</body></html>
